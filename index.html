<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#10262B" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Thai Vocab" />
<meta name="description" content="Learn Thai vocabulary by typing answers — typed recall, listening, sentence building, tone drills and progress tracking." />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<title>Thai Vocab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10262B; --surface:#16343A; --surface2:#1D424A; --surface3:#245059;
    --gold:#E7B24C; --cream:#EFE9DA; --muted:#7FA0A0;
    --jade:#5FB38A; --clay:#E07856; --line:rgba(239,233,218,.12);
    --nav-h:64px;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{height:100%;-webkit-text-size-adjust:100%}
  body{background:var(--ink);color:var(--cream);font-family:'Inter',system-ui,sans-serif;
    min-height:100dvh;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
    padding:calc(14px + env(safe-area-inset-top)) 14px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom))}
  button{font-family:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  input,select{font-family:inherit}
  .wrap{max-width:560px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
  h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:24px;letter-spacing:-.02em}
  h1 span{color:var(--gold)}
  .stat{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.5}
  .stat b{color:var(--cream);font-weight:600}
  .stat .fire{color:var(--gold)}

  /* bottom nav */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(16,38,43,.92);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center}
  .nav-inner{display:flex;width:100%;max-width:560px;gap:2px}
  .nav button{flex:1;border:0;background:transparent;color:var(--muted);font-size:10.5px;font-weight:600;
    padding:6px 2px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;transition:.15s}
  .nav button .ic{font-size:20px;line-height:1}
  .nav button.active{color:var(--gold);background:rgba(231,178,76,.1)}

  /* chips */
  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:9px;margin-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--muted);
    font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:20px;cursor:pointer;transition:.15s;min-height:34px}
  .chip.active{background:var(--gold);color:var(--ink);border-color:var(--gold)}
  .chip.jade.active{background:var(--jade);border-color:var(--jade)}
  .chip.clay.active{background:var(--clay);border-color:var(--clay);color:#fff}
  .seg{display:flex;gap:4px;background:var(--surface);border-radius:13px;padding:4px;margin-bottom:12px}
  .seg button{flex:1;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;
    padding:9px 4px;border-radius:10px;cursor:pointer;transition:.15s;min-height:40px}
  .seg button.active{background:var(--surface2);color:var(--cream)}

  /* cards */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 18px;margin-top:6px;text-align:center}
  .prompt{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:26px;letter-spacing:-.01em;line-height:1.2;overflow-wrap:anywhere}
  .prompt.th{font-family:'Noto Sans Thai',sans-serif;font-size:44px;font-weight:500}
  .prompt.rom{font-size:34px;color:var(--gold);font-style:italic}
  .sub{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.5}
  .thai{font-family:'Noto Sans Thai',sans-serif;font-weight:500;font-size:38px;line-height:1.3}
  .rom{font-size:18px;color:var(--gold);font-weight:500}
  .tone{font-size:12px;color:var(--muted)}
  .row{display:flex;gap:10px;margin-top:16px}
  .btn{flex:1;border:0;font-size:15px;font-weight:600;padding:14px;border-radius:13px;cursor:pointer;transition:.15s;min-height:48px}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.5;cursor:default}
  .ghost{background:var(--surface2);color:var(--cream)}
  .gold{background:var(--gold);color:var(--ink)}
  .got{background:rgba(95,179,138,.18);color:#bfe8d4;border:1px solid var(--jade)}
  .miss{background:rgba(224,120,86,.16);color:#f2c3b1;border:1px solid var(--clay)}
  .listen{background:transparent;border:1px solid var(--gold);color:var(--gold);border-radius:12px;
    padding:8px 16px;font-size:18px;cursor:pointer;min-height:48px;min-width:56px}
  .listen.big{font-size:34px;padding:16px 26px;border-radius:18px;margin:10px auto 0}
  .listen.live{background:rgba(224,120,86,.16);border-color:var(--clay);color:#f2c3b1;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}
  .tq .chips{padding-bottom:4px}
  .tq .chip{padding:6px 10px;min-height:30px;font-size:12px}

  /* typed answer */
  .field{margin-top:18px;display:flex;gap:8px}
  .field input{flex:1;background:var(--ink);border:1.5px solid var(--line);color:var(--cream);font-size:18px;
    padding:13px 14px;border-radius:13px;outline:none;min-width:0;text-align:center}
  .field input:focus{border-color:var(--gold)}
  .field input.ok{border-color:var(--jade);background:rgba(95,179,138,.08)}
  .field input.bad{border-color:var(--clay);background:rgba(224,120,86,.08)}
  .field input::placeholder{color:rgba(127,160,160,.6)}
  .verdict{margin-top:14px;padding:14px;border-radius:14px;text-align:center;line-height:1.5}
  .verdict.ok{background:rgba(95,179,138,.12);border:1px solid rgba(95,179,138,.4)}
  .verdict.close{background:rgba(231,178,76,.1);border:1px solid rgba(231,178,76,.4)}
  .verdict.bad{background:rgba(224,120,86,.1);border:1px solid rgba(224,120,86,.4)}
  .verdict h3{font-size:14px;font-weight:700;margin-bottom:6px;letter-spacing:.02em;text-transform:uppercase}
  .verdict.ok h3{color:#bfe8d4}.verdict.close h3{color:var(--gold)}.verdict.bad h3{color:#f2c3b1}
  .verdict .thai{font-size:34px}
  .verdict .rom{font-size:17px}
  .verdict .answer{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:28px;line-height:1.2;overflow-wrap:anywhere}
  .verdict .note{font-size:12.5px;color:var(--muted);margin-top:4px}
  .hintline{margin-top:10px;font-size:13px;color:var(--muted);min-height:18px}
  .link{background:transparent;border:0;color:var(--muted);text-decoration:underline;font-size:12.5px;cursor:pointer;padding:6px 8px}

  /* progress bar */
  .bar{height:6px;background:var(--surface2);border-radius:6px;overflow:hidden;margin:4px 0 12px}
  .bar i{display:block;height:100%;background:var(--gold);border-radius:6px;transition:width .3s}
  .bar.jade i{background:var(--jade)}
  .barlabel{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

  /* lists */
  .list{margin-top:6px;display:flex;flex-direction:column;gap:8px}
  .item{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 14px;
    display:flex;align-items:center;gap:12px;cursor:pointer}
  .item .en{flex:1;font-size:14px;min-width:0}
  .item .en small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
  .item .thai{font-family:'Noto Sans Thai',sans-serif;font-size:22px;font-weight:500;line-height:1.2}
  .item .rom{font-size:13px;color:var(--gold);text-align:right}
  .item button{background:transparent;border:0;color:var(--gold);font-size:18px;cursor:pointer;padding:6px;min-width:36px}
  .badge{font-size:10.5px;padding:3px 7px;border-radius:10px;font-weight:600;white-space:nowrap}
  .b-weak{background:rgba(224,120,86,.16);color:#f2c3b1}
  .b-solid{background:rgba(95,179,138,.16);color:#bfe8d4}
  .b-new{background:rgba(231,178,76,.14);color:var(--gold)}
  .b-learn{background:rgba(127,160,160,.18);color:var(--muted)}
  .search{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--cream);font-size:16px;
    padding:12px 14px;border-radius:13px;outline:none;margin-bottom:10px}
  .search:focus{border-color:var(--gold)}

  /* flashcard */
  .flash{perspective:1200px;margin-top:6px}
  .flash .inner{position:relative;min-height:260px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
  .flash.flipped .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);
    border:1px solid var(--line);border-radius:20px;padding:24px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
  .face.back{transform:rotateY(180deg);background:var(--surface2)}
  .face .tag{position:absolute;top:12px;left:14px;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
  .face .cnt{position:absolute;top:12px;right:14px;font-size:11px;color:var(--muted)}

  /* sentence builder */
  .slot{min-height:76px;background:var(--ink);border:1.5px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:16px}
  .slot.ok{border-color:var(--jade);border-style:solid}
  .slot.bad{border-color:var(--clay);border-style:solid}
  .slot .ph{color:var(--muted);font-size:13px}
  .tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;min-height:56px}
  .tile{background:var(--surface2);border:1px solid var(--line);color:var(--cream);border-radius:12px;padding:8px 12px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:1px;min-height:48px;transition:.12s}
  .tile:active{transform:scale(.97)}
  .tile .t{font-family:'Noto Sans Thai',sans-serif;font-size:22px;line-height:1.2}
  .tile .r{font-size:11px;color:var(--gold)}
  .tile.used{opacity:.25;pointer-events:none}
  .gloss{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .gloss span{font-size:11.5px;color:var(--muted);background:var(--ink);padding:4px 8px;border-radius:8px}
  .gloss span b{color:var(--cream);font-weight:500;font-family:'Noto Sans Thai',sans-serif;font-size:14px}
  .gloss span.ok{border:1px solid rgba(95,179,138,.5)}.gloss span.close{border:1px solid rgba(231,178,76,.5)}.gloss span.bad{border:1px solid rgba(224,120,86,.6);color:#f2c3b1}

  /* tones */
  .tonegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
  .tonebtn{background:var(--surface2);border:1px solid var(--line);color:var(--cream);border-radius:13px;padding:14px 8px;cursor:pointer;font-size:14px;font-weight:600;min-height:56px;transition:.15s}
  .tonebtn:last-child:nth-child(odd){grid-column:span 2}
  .tonebtn small{display:block;color:var(--muted);font-weight:500;font-size:11.5px;margin-top:2px}
  .tonebtn.ok{border-color:var(--jade);background:rgba(95,179,138,.18)}
  .tonebtn.bad{border-color:var(--clay);background:rgba(224,120,86,.16)}
  .tonebtn:disabled{cursor:default}
  .toneref,.dayref{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 14px}
  .toneref summary,.dayref summary{cursor:pointer;font-size:13.5px;font-weight:600;padding:8px 0;list-style:none;display:flex;justify-content:space-between}
  .toneref summary::after,.dayref summary::after{content:"+";color:var(--muted)}
  .toneref[open] summary::after,.dayref[open] summary::after{content:"–"}
  .dayref{margin-top:0;margin-bottom:8px}
  .dayref .list{margin:0 0 10px}
  .toneref table{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0 10px}
  .toneref td{padding:7px 4px;border-top:1px solid var(--line);vertical-align:top}
  .toneref td:first-child{font-weight:600;white-space:nowrap}
  .toneref td .thai{font-size:20px}
  .toneref .mark{color:var(--gold);font-size:18px}
  .toneref p{font-size:12.5px;color:var(--muted);line-height:1.6;padding-bottom:10px}

  /* progress */
  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:6px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
  .kpi b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:700;line-height:1.1}
  .kpi span{font-size:11px;color:var(--muted)}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
  .panel h2{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto}
  .heat i{width:100%;aspect-ratio:1;min-width:10px;border-radius:3px;background:var(--surface2)}
  .heat i.l1{background:rgba(231,178,76,.35)}.heat i.l2{background:rgba(231,178,76,.6)}.heat i.l3{background:var(--gold)}
  .heat i.today{outline:1.5px solid var(--cream)}
  .mrow{display:flex;align-items:center;gap:10px;font-size:13px;padding:5px 0}
  .mrow .n{width:82px;color:var(--cream);font-weight:500}
  .mrow .stack{flex:1;height:8px;background:var(--surface2);border-radius:6px;overflow:hidden;display:flex}
  .mrow .stack i{display:block;height:100%}
  .mrow .stack .s{background:var(--jade)}.mrow .stack .l{background:var(--gold)}.mrow .stack .w{background:var(--clay)}
  .mrow .c{width:44px;text-align:right;color:var(--muted);font-size:12px}
  .legend{display:flex;gap:12px;font-size:11px;color:var(--muted);margin-top:8px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
  .setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
  .setrow:first-of-type{border-top:0}
  .setrow input[type=range]{width:130px;accent-color:var(--gold)}
  .setrow select{background:var(--surface2);color:var(--cream);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:14px}
  .toggle{width:46px;height:26px;border-radius:13px;background:var(--surface3);border:0;position:relative;cursor:pointer;transition:.2s}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.2s}
  .toggle.on{background:var(--jade)}.toggle.on::after{left:23px;background:#fff}
  .small{background:var(--surface2);color:var(--cream);border:0;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer;min-height:38px}
  .small.danger{background:rgba(224,120,86,.16);color:#f2c3b1;border:1px solid var(--clay)}
  textarea.io{width:100%;background:var(--ink);color:var(--cream);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;font-family:ui-monospace,monospace;min-height:80px;margin-top:8px}

  .empty{text-align:center;color:var(--muted);font-size:14px;padding:40px 20px;line-height:1.6}
  .foot{text-align:center;font-size:11px;color:var(--muted);margin-top:18px;line-height:1.7}
  .warn{background:rgba(224,120,86,.12);border:1px solid rgba(224,120,86,.3);color:#f2c3b1;
    font-size:12px;padding:9px 12px;border-radius:11px;margin-top:12px;display:none}
  .toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
    background:var(--cream);color:var(--ink);font-size:13px;font-weight:600;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:30;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .summary{text-align:center;padding:10px 0}
  .summary .big{font-family:'Bricolage Grotesque',sans-serif;font-size:48px;font-weight:700;color:var(--gold);line-height:1}
  .summary p{color:var(--muted);font-size:14px;margin-top:6px;line-height:1.5}
  @keyframes pop{0%{transform:scale(.96);opacity:.6}100%{transform:scale(1);opacity:1}}
  .pop{animation:pop .18s ease-out}
  @media (max-width:360px){ .prompt{font-size:22px} .prompt.th{font-size:38px} .thai{font-size:32px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Thai<span>·</span>Vocab</h1>
    <div class="stat" id="stat"></div>
  </header>

  <div id="stage"></div>

  <div class="warn" id="banner" style="color:var(--cream);border-color:var(--gold);background:rgba(231,178,76,.1)"></div>
  <div class="warn" id="warn">No Thai voice on this device — 🔊 needs a Thai voice installed (iOS: Settings → Accessibility → Spoken Content → Voices → Thai).</div>
  <div class="foot" id="foot"></div>
</div>

<nav class="nav"><div class="nav-inner">
  <button data-mode="today" class="active"><span class="ic">📅</span>Today</button>
  <button data-mode="practice"><span class="ic">⌨️</span>Practice</button>
  <button data-mode="learn"><span class="ic">🃏</span>Learn</button>
  <button data-mode="build"><span class="ic">🧩</span>Build</button>
  <button data-mode="tones"><span class="ic">🎵</span>Tones</button>
  <button data-mode="progress"><span class="ic">📈</span>Progress</button>
</div></nav>
<div class="toast" id="toast"></div>

<script>
// =====================================================================
//  WORD BANK  (progress is keyed by id, so the bank can grow safely)
//  `g` = grammar tag for the Build-tab sentence generator (see README → "Grammar tags").
//  Words without a tag still work everywhere; they just join fewer sentence frames.
// =====================================================================
const WORDS = [
  // Day 1
  {id:"phom",th:"ผม",rom:"phǒm",en:"I / me (men)",tone:"rising",day:1,cat:"People",g:{pos:"pron",s:"I",o:"me",be:"am",n:1}},
  {id:"khun",th:"คุณ",rom:"khun",en:"you",tone:"mid",day:1,cat:"People",g:{pos:"pron",s:"you",o:"you",be:"are",n:2}},
  {id:"khao_he",th:"เขา",rom:"khǎo",en:"he / she",tone:"rising",day:1,cat:"People",g:{pos:"pron",s:"he|she",o:"him|her",be:"is",n:3}},
  {id:"rao",th:"เรา",rom:"rao",en:"we",tone:"mid",day:1,cat:"People",g:{pos:"pron",s:"we",o:"us",be:"are",n:2}},
  {id:"gin",th:"กิน",rom:"gin",en:"eat",tone:"mid",day:1,cat:"Verbs",g:{pos:"v",en:"eat",obj:["food","dem"],asp:"any",at:1,with:1,maak:1}},
  {id:"deum",th:"ดื่ม",rom:"dèum",en:"drink",tone:"low",day:1,cat:"Verbs",g:{pos:"v",en:"drink",obj:["drink","dem"],asp:"any",at:1,with:1,maak:1}},
  {id:"ao",th:"เอา",rom:"ao",en:"want / take",tone:"mid",day:1,cat:"Verbs",g:{pos:"v",en:"want",obj:["food","drink","thing","dem"],asp:"simple",it:1,art:"a",comp:0}},
  {id:"yaak",th:"อยาก",rom:"yàak",en:"want to (+verb)",tone:"low",day:1,cat:"Verbs",g:{pos:"aux"}},
  {id:"bpai",th:"ไป",rom:"bpai",en:"go",tone:"mid",day:1,cat:"Verbs",g:{pos:"v",en:"go",dest:"away",asp:"prog",with:1}},
  {id:"mii",th:"มี",rom:"mii",en:"have",tone:"mid",day:1,cat:"Verbs",g:{pos:"v",en:"have",obj:["food","drink","thing"],asp:"simple",it:1,art:"a"}},
  {id:"mai_not",th:"ไม่",rom:"mâi",en:"not / no",tone:"falling",day:1,cat:"Glue"},

const DIRS=["th","en"];

function migrate(j){ // v2 stats were flat (one record per word, from EN → Thai drills) → move them under .th
  const out={}; Object.entries(j.stats||{}).forEach(([id,x])=>{ out[id]=("seen" in x)?{th:{...blank(),...x},en:blank()}:x; }); j.stats=out; j.v=3; return j;
}
function load(){ try{const r=localStorage.getItem(KEY); if(r){let j=JSON.parse(r); if(!j.v||j.v<3) j=migrate(j); S={...S,...j,settings:{...DEFAULT_SETTINGS,...(j.settings||{})}};}}catch(e){} }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
function stD(id,dir){ return (S.stats[id]&&S.stats[id][dir])||blank(); }
function st(id){ // merged view across both directions (for badges, totals, weak lists)
  const a=stD(id,"th"), b=stD(id,"en"); const seen=[a,b].filter(x=>x.seen>0);
  return {right:a.right+b.right,wrong:a.wrong+b.wrong,seen:a.seen+b.seen,streak:Math.min(a.streak,b.streak),
          due:seen.length?Math.min(...seen.map(x=>x.due||0)):0,last:Math.max(a.last,b.last)};
}
const todayKey=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
function logActivity(){ const k=todayKey(); S.activity[k]=(S.activity[k]||0)+1; }
const INTERVALS=[0,1,3,7,14,30,60]; // days between reviews by streak
function record(id,ok,dir){
  dir=dir||"th"; const s=stD(id,dir); s.seen++; s.last=Date.now();
  if(ok){ s.right++; s.streak=(s.streak||0)+1; s.due=Date.now()+INTERVALS[Math.min(s.streak,INTERVALS.length-1)]*864e5; }
  else { s.wrong++; s.streak=0; s.due=Date.now(); }
  S.stats[id]={...(S.stats[id]||{}),[dir]:s}; logActivity(); save();
}
function knownD(id,dir){ const s=stD(id,dir); return s.right>=3 && s.streak>=2; }
function isWeakD(id,dir){ const s=stD(id,dir); return s.wrong>0 && !knownD(id,dir); }
function isDueD(id,dir){ const s=stD(id,dir); return s.seen>0 && (s.due||0)<=Date.now(); }
function known(id){ return knownD(id,"th") && knownD(id,"en"); }
function halfKnown(id){ return !known(id) && (knownD(id,"th") || knownD(id,"en")); }
function isWeak(id){ return DIRS.some(d=>isWeakD(id,d)); }
function isDue(id){ return DIRS.some(d=>isDueD(id,d)); }
function noteOf(id){ return (S.notes&&S.notes[id])||""; }
function todayCount(){ return S.activity[todayKey()]||0; }
function streakDays(){
  let n=0; const d=new Date(); const k=todayKey();
  if(!S.activity[k]) d.setDate(d.getDate()-1); // streak still alive if you practised yesterday
  for(;;){ const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if(S.activity[key]) { n++; d.setDate(d.getDate()-1); } else break; if(n>3650) break; }
  return n;
}

// =====================================================================
function skeleton(s){
  s=(s||"").toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  s=s.replace(/ʉ/g,'ue').replace(/ɛ/g,'ae').replace(/ɔ/g,'o').replace(/ə/g,'oe').replace(/œ/g,'oe');
  s=s.replace(/[^a-z]/g,'');
  s=s.replace(/kh/g,'k').replace(/ph/g,'p').replace(/th/g,'t').replace(/bp/g,'p').replace(/dt/g,'t').replace(/ch/g,'c').replace(/ck/g,'k').replace(/j/g,'c');
  s=s.replace(/g/g,'k').replace(/b/g,'p').replace(/d/g,'t');
  s=s.replace(/ar(?![aeiou])/g,'a').replace(/or(?![aeiou])/g,'o').replace(/er(?![aeiou])/g,'e').replace(/aw(?![aeiou])/g,'o').replace(/oe/g,'e')
     .replace(/eu/g,'u').replace(/ue/g,'u').replace(/ow/g,'ao').replace(/au/g,'ao').replace(/ay/g,'ai').replace(/ee/g,'i').replace(/oo/g,'u');
  s=s.replace(/(.)\1+/g,'$1');
  return s;
}
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); } prev=cur; }
  return prev[n];
}
function romAlts(w){ // "rʉ̌ʉ (reu)" -> ["rʉ̌ʉ","reu"]
  return w.rom.split(/[()/]/).map(x=>x.trim()).filter(Boolean);
}
// sequence of tone marks in a romanised string, e.g. "hông-náam" -> "^'"  (mid tone has no mark)
function toneSig(s){ return (s||"").normalize('NFD').replace(/[^\u0300\u0301\u0302\u030C]/g,'').replace(/\u0300/g,'`').replace(/\u0301/g,"'").replace(/\u0302/g,'^').replace(/\u030C/g,'v'); }
let lastToneMiss=false;
// returns "ok" | "close" | "bad"
function checkThai(w,input){
  lastToneMiss=false;
  const raw=(input||"").trim(); if(!raw) return "bad";
  if(raw.normalize('NFC')===w.th.normalize('NFC')) return "ok";
  const typed=skeleton(raw); if(!typed) return "bad";
  const targets=[...romAlts(w),w.rom].map(skeleton);
  if(targets.includes(typed)){
    if(S.settings.hard){ const sig=toneSig(raw); if(!romAlts(w).some(r=>toneSig(r)===sig)){ lastToneMiss=true; return "close"; } }
    return "ok";
  }
  if(targets.some(t=>t.length>=4 && lev(t,typed)<=1)) return "close";
  return "bad";
}
function normEn(s){ return (s||"").toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\b(to|the|a|an)\b/g,' ').replace(/\s+/g,' ').trim(); }
function enAlts(w){
  const out=new Set();
  let base=w.en.replace(/\([^)]*\)/g,'').trim();
  if(!base) base=w.en.replace(/[()]/g,'');
  base.split('/').forEach(p=>{ const n=normEn(p); if(n) out.add(n); });
  (w.alt||[]).forEach(a=>{ const n=normEn(a); if(n) out.add(n); });
  return [...out];
}
function checkEn(w,input){
  const t=normEn(input); if(!t) return "bad";
  const alts=enAlts(w);
  if(alts.includes(t)) return "ok";
  const tw=t.split(' ');
  // typed words are a subset of an alternative's words (e.g. "want" for "want to")
  if(alts.some(a=>{ const aw=a.split(' '); return tw.every(x=>aw.includes(x)); })) return "ok";
  if(alts.some(a=>a.length>=4 && lev(a,t)<=1)) return "close";
  return "bad";
}

function renderStat(){
  const total=WORDS.length,k=WORDS.filter(w=>known(w.id)).length, sd=streakDays();
  $('stat').innerHTML=`<span class="fire">🔥 ${sd}</span> day${sd===1?'':'s'} · <b>${k}</b>/${total} solid`;
}

// ---------------------------------------------------------------------
//  PRACTICE (typed recall)  — also drives the Today tab and its daily review
// ---------------------------------------------------------------------
const SUBS=[["type","EN→Thai"],["listen","Listen 🔊"],["read","Rom→EN"],["shadow","Speak 🗣"]];
// which memory direction a drill trains:  type/shadow = produce Thai (th),  listen/read = recognise Thai (en)
const subDir=sub=>(sub==="type"||sub==="shadow")?"th":"en";
const curDir=()=>subDir(P.sub);
const isReview=()=>mode==="today" && P.day==="review";
function practicePool(){
  if(isReview()) return WORDS;
  if(mode==="today") return WORDS.filter(w=>w.day===TODAY_DAY());
  const d=curDir();
  if(P.filter==="Due") return WORDS.filter(w=>isDueD(w.id,d));
  if(P.filter==="Weak") return WORDS.filter(w=>isWeakD(w.id,d));
  if(P.filter==="New") return WORDS.filter(w=>stD(w.id,d).seen===0);
  if(P.filter==="All") return WORDS;
  return WORDS.filter(w=>w.cat===P.filter);
}
function priority(w,dir){
  const s=stD(w.id,dir); let p=Math.random()*2;
  if(s.seen===0) p+=4;                          // new words come early
  if(s.seen>0 && (s.due||0)<=Date.now()) p+=6;  // due for review
  p+=s.wrong*2 - s.streak;                      // weak words rise, solid words sink
  if(s.last && Date.now()-s.last<60e3) p-=8;    // avoid immediate repeats
  return p;
}
function pickNext(){ const p=practicePool(); if(!p.length) return null; const d=curDir(); return p.slice().sort((a,b)=>priority(b,d)-priority(a,d))[0]; }

// ---- daily review queue: due words from earlier days (weaker direction first) + every word of the newest day, both directions
function reviewQueue(){
  const nd=NEWEST_DAY(), old=[];
  WORDS.filter(w=>w.day<nd).forEach(w=>{
    const dirs=DIRS.filter(d=>isDueD(w.id,d));
    if(!dirs.length) return;
    const dir=dirs.sort((a,b)=>(stD(w.id,b).wrong-stD(w.id,b).streak)-(stD(w.id,a).wrong-stD(w.id,a).streak))[0];
    old.push({id:w.id,dir,p:stD(w.id,dir).wrong*2-stD(w.id,dir).streak+Math.random()});
  });
  old.sort((a,b)=>b.p-a.p);
  const q=old.slice(0,S.settings.reviewOld).map(({id,dir})=>({id,dir}));
  WORDS.filter(w=>w.day===nd).forEach(w=>{ q.push({id:w.id,dir:"th"}); q.push({id:w.id,dir:"en"}); });
  return shuffle(q);
}
function ensureReview(){
  const k=todayKey();
  if(!S.review || S.review.date!==k || !Array.isArray(S.review.queue)){ S.review={date:k,queue:reviewQueue(),i:0,right:0,done:false}; save(); }
  return S.review;
}
function reviewDoneToday(){ const r=S.review; return !!(r && r.date===todayKey() && r.done); }

function renderPractice(){
  const goal=S.settings.goal, tc=todayCount();
  const todayMode=mode==="today", review=isReview(), scope=review?"today:review":todayMode?"today:"+TODAY_DAY():"all";
  if(P.scope!==scope){ P.scope=scope; P.cur=null; P.phase="ask"; P.hint=0; P.tq=null; P.noteEdit=false; }
  if(!review) P.sub=P.userSub;
  const R=review?ensureReview():null;
  if(review && P.phase==="ask"){ // the queue decides word + direction
    const item=R.queue[R.i];
    if(item){ P.cur=BY_ID[item.id]||null; P.sub=item.dir==="th"?"type":"read"; if(!P.cur){ R.i++; save(); return renderPractice(); } }
    else P.cur=null;
  }
  const listenOk = P.sub!=="listen" || hasThaiVoice() || !window.speechSynthesis;
  const filters=["All","Due","Weak","New",...CATS()];
  const cnt=f=>{ const old=P.filter; P.filter=f; const n=practicePool().length; P.filter=old; return n; };
  let html=review?'':`
    <div class="seg" id="subseg">${SUBS.map(([k,l])=>`<button data-sub="${k}" class="${P.sub===k?'active':''}">${l}</button>`).join('')}</div>`;
  html+=`
    ${todayMode?todayHeader(R):`<div class="chips" id="chips">${filters.map(f=>{
      const n=cnt(f); const cls=f==="Weak"?"clay":f==="Due"?"jade":"";
      return `<button class="chip ${cls} ${f===P.filter?'active':''}" data-f="${f}">${f}${["Due","Weak","New"].includes(f)?` ${n}`:''}</button>`; }).join('')}</div>`}
    <div class="barlabel"><span>Today ${Math.min(tc,goal)}/${goal}${tc>=goal?' ✓ goal reached':''}</span><span>${review?`Review ${Math.min(R.i,R.queue.length)}/${R.queue.length}`:`Session ${P.session.right}/${P.session.n}`}</span></div>
    <div class="bar ${tc>=goal?'jade':''}"><i style="width:${Math.min(100,tc/goal*100)}%"></i></div>`;

  if(review && R.i>=R.queue.length){ // finished today's queue
    if(!R.done){ R.done=true; save(); }
    const pct=R.queue.length?Math.round(R.right/R.queue.length*100):0;
    html+=`<div class="card pop"><div class="summary"><div class="big">${R.right}/${R.queue.length}</div><p>Daily review done ✓ · ${pct}% right<br>${R.queue.length?'':'Nothing was due — add words or come back tomorrow.'}</p></div>
      <div class="row"><button class="btn ghost" id="rebuild">Rebuild queue</button><button class="btn gold" id="daycards2">Flashcards Day ${NEWEST_DAY()} →</button></div></div>`;
    stage().innerHTML=html; bindPractice(); renderStat(); return;
  }
  if(!P.cur) P.cur=pickNext();
  if(!P.cur){
    html+=`<div class="empty">${todayMode?`No words for Day ${TODAY_DAY()} yet.`:P.filter==="Due"?"Nothing due right now 🎉<br>Come back later or practise another set.":P.filter==="Weak"?"No weak words 🎉<br>Words you miss will show up here.":P.filter==="New"?"You've seen every word! Switch to All or Due.":"No words in this set yet."}</div>`;
    stage().innerHTML=html; bindPractice(); renderStat(); return;
  }
  const w=P.cur;
  const isThaiAnswer = P.sub!=="read";
  const dirTag=review?`<span class="tag" style="position:static;display:inline-block;margin-bottom:6px">${DIR_LABEL[subDir(P.sub)]}</span><br>`:'';
  const promptHtml = P.sub==="type" ? `${dirTag}<div class="prompt">${esc(w.en)}</div><div class="sub">Type it in Thai (romanised is fine, e.g. <i>khao</i>)${S.settings.hard?' — <b>hard mode: tone marks required</b>':' — tones optional'}</div>`
    : P.sub==="listen" ? `<button class="listen big" id="play" aria-label="play">🔊</button><div class="sub">Listen, then type what it means (or the Thai word)${listenOk?'':'<br><b>No Thai voice on this device — showing the word instead:</b><br><span class="thai" style="font-size:30px">'+esc(w.th)+'</span>'}</div>`
    : P.sub==="read" ? `${dirTag}<div class="prompt rom">${esc(w.rom)}</div><div class="sub">Type the meaning in English</div>`
    : `<div class="prompt">${esc(w.en)}</div><div class="rom" style="margin-top:6px;font-size:22px">${esc(w.rom)}</div><div class="sub">Listen, then say it out loud — copy the tone.</div>`;

  html+=`<div class="card pop">${promptHtml}`;
  if(P.sub==="shadow"){
    html+=shadowHtml(w);
  } else if(P.phase==="ask"){
    html+=`<form class="field" id="ansform" autocomplete="off"><input id="ans" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="${isThaiAnswer?'your answer…':'meaning in English…'}" ${P.sub==='read'?'':'lang="th"'}>
      <button class="btn gold" type="submit" style="flex:0 0 auto;padding:14px 18px">Check</button></form>
      <div class="hintline" id="hintline">${hintText(w)}</div>
      <div class="row" style="margin-top:8px"><button class="link" id="hint">💡 Hint</button><button class="link" id="show">Show answer</button></div>`;
  } else {
    const v=P.verdict;
    html+=`<div class="verdict ${v}">
        <h3>${v==="ok"?"✓ Correct":v==="close"?(P.toneMiss?"≈ Right word, wrong tones":"≈ Close enough"):"✗ Not quite"}</h3>
        ${P.sub==="read"
          ? `<div class="answer">${esc(w.en)}</div><div class="rom">${esc(w.rom)} · <span class="thai" style="font-size:20px">${esc(w.th)}</span></div>
             <div class="note">${esc(w.tone)} tone${P.typed?` · you typed “${esc(P.typed)}”`:''}</div>`
          : `<div class="thai">${esc(w.th)}</div><div class="rom">${esc(w.rom)}</div>
             <div class="note">${esc(w.en)} · ${esc(w.tone)} tone${P.typed?` · you typed “${esc(P.typed)}”`:''}</div>`}
        ${noteHtml(w)}
        ${toneQuizHtml(w)}
      </div>
      <div class="row"><button class="listen" id="say">🔊</button>
        ${v==="bad"?`<button class="btn got" id="override">I was right</button>`:''}
        <button class="btn gold" id="next">Next →</button></div>`;
  }
  html+=`</div>`;
  if(!review && P.session.n>0 && P.session.n%goal===0 && P.phase==="ask" && !P.done){
    P.done=true; toast(`Session: ${P.session.right}/${P.session.n} correct 🎉`);
  }
  stage().innerHTML=html;
  bindPractice();
  if(P.sub==="shadow"){ if(P.phase==="ask" && S.settings.autoplay && hasThaiVoice()) setTimeout(()=>speak(w.th),150); }
  else if(P.phase==="ask"){ const inp=$('ans'); if(inp){ inp.focus({preventScroll:true}); } if(P.sub==="listen"&&S.settings.autoplay&&hasThaiVoice()) setTimeout(()=>speak(w.th),150); }
  else if(P.sub!=="listen" && S.settings.autoplay) speak(w.th);
  renderStat();
}
function todayHeader(R){
  const d=TODAY_DAY(), nd=NEWEST_DAY(), rev=P.day==="review";
  const chips=`<div class="chips" id="daychips"><button class="chip jade ${rev?'active':''}" data-day="review">📚 Daily review${reviewDoneToday()?' ✓':''}</button>${DAYS().map(x=>`<button class="chip ${!rev&&x===d?'active':''}" data-day="${x}">Day ${x}${x===nd?' · today':''}</button>`).join('')}</div>`;
  if(rev){
    const nOld=R.queue.filter(q=>BY_ID[q.id]&&BY_ID[q.id].day<nd).length, nNew=R.queue.length-nOld;
    return chips+`<details class="dayref" id="dayref" ${P.dayOpen?'open':''}><summary><span>📚 Today's queue · ${nOld} due from earlier days + ${nNew} reps of Day ${nd}</span></summary>
      <div class="list">${R.queue.map((q,i)=>{ const w=BY_ID[q.id]; if(!w) return ''; return `<div class="item" data-say="${esc(w.th)}" style="${i<R.i?'opacity:.45':''}"><div class="thai">${esc(w.th)}</div><div class="en">${esc(w.en)}<small>${DIR_LABEL[q.dir]} · day ${w.day}${i<R.i?' · done':''}</small></div><div class="rom">${esc(w.rom)}</div>${badge(w)}</div>`; }).join('')}</div>
      <div class="row" style="margin:0 0 10px"><button class="link" id="rebuild">↻ Rebuild queue</button></div></details>`;
  }
  const ws=WORDS.filter(w=>w.day===d), solid=ws.filter(w=>known(w.id)).length;
  return chips+`<details class="dayref" id="dayref" ${P.dayOpen?'open':''}><summary><span>📅 Day ${d} · ${ws.length} words · ${solid} solid</span></summary>
    <div class="list">${ws.map(w=>`<div class="item" data-say="${esc(w.th)}"><div class="thai">${esc(w.th)}</div><div class="en">${esc(w.en)}<small>${esc(w.tone)} · ${esc(w.cat)}${noteOf(w.id)?` · 📝 ${esc(noteOf(w.id))}`:''}</small></div><div class="rom">${esc(w.rom)}</div>${badge(w)}<button aria-label="listen">🔊</button></div>`).join('')}</div>
    <div class="row" style="margin:0 0 10px"><button class="link" id="daycards">🃏 Flashcards for Day ${d} →</button></div></details>`;
}
// ---- shadow (speak) mode: listen → say it → reveal; optional speech recognition check
const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
function shadowHtml(w){
  const revealed=P.phase!=="ask";
  let h=`<div class="row" style="justify-content:center"><button class="listen big" id="play" aria-label="play">🔊</button>${SR?`<button class="listen big ${P.listening?'live':''}" id="mic" aria-label="say it">🎤</button>`:''}</div>`;
  if(P.heard!=null) h+=`<div class="verdict ${P.heardOk?'ok':'bad'}" style="margin-top:12px"><h3>${P.heardOk?'✓ Recognised':'✗ Heard something else'}</h3><div class="thai" style="font-size:26px">${esc(P.heard||'…')}</div>${P.heardOk?'':`<div class="note">target: <span class="thai" style="font-size:18px">${esc(w.th)}</span> ${esc(w.rom)}</div>`}</div>`;
  else if(SR) h+=`<div class="sub" style="margin-top:6px">${P.listening?'Listening… say it now':'Tap 🎤 and say the word — rough check only, the tone still needs your ear.'}</div>`;
  else h+=`<div class="sub" style="margin-top:6px">Speech recognition isn't available in this browser — just say it aloud.</div>`;
  if(revealed) h+=`<div class="verdict ok" style="margin-top:12px"><div class="thai">${esc(w.th)}</div><div class="rom">${esc(w.rom)}</div><div class="note">${esc(w.tone)} tone</div>${noteHtml(w)}</div>
      <div class="row"><button class="btn miss" id="sagain">Again ↺</button><button class="btn got" id="sgot">Got it ✓</button></div>`;
  else h+=`<div class="row"><button class="btn gold" id="sreveal">Reveal Thai →</button></div>`;
  return h;
}
function startListening(w){
  if(!SR || P.listening) return;
  try{
    const r=new SR(); r.lang="th-TH"; r.interimResults=false; r.maxAlternatives=3;
    P.listening=true; P.heard=null; renderPractice();
    r.onresult=e=>{ const alts=[...e.results[0]].map(x=>x.transcript.replace(/\s+/g,'').normalize('NFC')); const t=w.th.replace(/\s+/g,'').normalize('NFC');
      P.heard=alts[0]||''; P.heardOk=alts.some(a=>a===t||a.includes(t)||t.includes(a)&&a.length>=Math.max(1,t.length-1)); if(P.heardOk){ logActivity(); save(); } };
    r.onerror=()=>{ P.heard=P.heard||''; };
    r.onend=()=>{ P.listening=false; if(P.heard==null) P.heard=''; renderPractice(); };
    r.start();
  }catch(e){ P.listening=false; toast('Microphone not available'); }
}
// ---- notes (your own hook / mnemonic per word)
function noteHtml(w){
  const n=noteOf(w.id);
  if(P.noteEdit) return `<div class="field" style="margin-top:10px"><input id="noteinp" type="text" placeholder="e.g. water room = bathroom" value="${esc(n)}" maxlength="140"><button class="btn gold" id="notesave" style="flex:0 0 auto;padding:12px 14px">Save</button></div>`;
  return `<div class="note" style="margin-top:8px">${n?`📝 ${esc(n)} `:''}<button class="link" id="noteedit" style="padding:2px 6px">${n?'✎ edit note':'✎ add a note'}</button></div>`;
}
// ---- tone follow-up after a miss (single-tone words only)
function toneQuizHtml(w){
  if(P.verdict==="ok" || w.tone.includes('+')) return '';
  const done=P.tq!=null; const t=TONES.find(x=>x.key===w.tone);
  return `<div class="tq" id="tq"><div class="note" style="margin:10px 0 6px">${done?(P.tq===w.tone?`✓ Yes — ${t.label} tone`:`✗ It's <b>${t.label}</b> (${t.mark})${TONES.find(x=>x.key===P.tq)?`, not ${TONES.find(x=>x.key===P.tq).label}`:''}`):'Which tone was that?'}</div>
    <div class="chips" style="justify-content:center;flex-wrap:wrap">${TONES.map(x=>`<button class="chip ${done&&x.key===w.tone?'active':''} ${done&&x.key===P.tq&&x.key!==w.tone?'clay active':''}" data-t="${x.key}" ${done?'disabled':''}>${x.label} <span style="color:${done&&x.key===w.tone?'inherit':'var(--gold)'}">${x.mark}</span></button>`).join('')}</div></div>`;
}
function hintText(w){
  if(!P.hint) return "";
  const alts=romAlts(w); const r=alts[alts.length-1]||w.rom;
  const syl=r.split(/[- ]/).length;
  if(P.sub==="read"){ const e=enAlts(w)[0]||""; return P.hint===1?`Starts with “${e[0]||'?'}…” · ${e.length} letters`:`${e.slice(0,Math.ceil(e.length/2))}…`; }
  return P.hint===1?`${syl} syllable${syl>1?'s':''} · starts with “${r[0]}”`:`${r.slice(0,Math.ceil(r.length/2))}…`;
}
function resetQ(){ P.cur=null; P.phase="ask"; P.hint=0; P.tq=null; P.noteEdit=false; P.heard=null; P.heardOk=false; P.toneMiss=false; }
function bindPractice(){
  const dch=$('daychips'); if(dch) dch.onclick=e=>{ const b=e.target.closest('.chip'); if(!b) return; P.day=b.dataset.day==="review"?"review":+b.dataset.day; renderPractice(); };
  const dr=$('dayref'); if(dr){ dr.ontoggle=()=>{ P.dayOpen=dr.open; }; dr.querySelectorAll('.item[data-say]').forEach(it=>it.onclick=()=>speak(it.dataset.say)); }
  const dc=$('daycards')||$('daycards2'); if(dc) dc.onclick=()=>{ L.day=P.day==="review"?NEWEST_DAY():TODAY_DAY(); L.view="cards"; L.idx=0; L.flipped=false; setMode("learn"); };
  const rb=$('rebuild'); if(rb) rb.onclick=()=>{ S.review=null; ensureReview(); resetQ(); renderPractice(); toast('Queue rebuilt'); };
  const seg=$('subseg'); if(seg) seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{ P.userSub=P.sub=b.dataset.sub; resetQ(); renderPractice(); });
  const chips=$('chips'); if(chips) chips.onclick=e=>{ const b=e.target.closest('.chip'); if(!b) return; P.filter=b.dataset.f; resetQ(); renderPractice(); };
  const form=$('ansform'); if(form) form.onsubmit=e=>{ e.preventDefault(); submitAnswer($('ans').value); };
  const play=$('play'); if(play) play.onclick=()=>speak(P.cur.th);
  const mic=$('mic'); if(mic) mic.onclick=()=>startListening(P.cur);
  const hint=$('hint'); if(hint) hint.onclick=()=>{ P.hint=Math.min(2,P.hint+1); $('hintline').textContent=hintText(P.cur); };
  const show=$('show'); if(show) show.onclick=()=>{ P.typed=""; finish("bad"); };
  const say=$('say'); if(say) say.onclick=()=>speak(P.cur.th);
  const next=$('next'); if(next) next.onclick=()=>{ if(isReview()){ S.review.i++; save(); } resetQ(); P.done=false; renderPractice(); };
  const ov=$('override'); if(ov) ov.onclick=()=>{ // undo the wrong mark, count as right
    const dir=curDir(), s=stD(P.cur.id,dir); s.wrong=Math.max(0,s.wrong-1); s.seen=Math.max(0,s.seen-1); S.stats[P.cur.id]={...(S.stats[P.cur.id]||{}),[dir]:s};
    const k=todayKey(); S.activity[k]=Math.max(0,(S.activity[k]||1)-1); P.session.n--; if(isReview()) S.review.right++;
    record(P.cur.id,true,dir); P.session.n++; P.session.right++; P.verdict="ok"; P.tq=null; renderPractice(); };
  // shadow
  const sr=$('sreveal'); if(sr) sr.onclick=()=>{ P.phase="done"; renderPractice(); };
  const sg=$('sgot'); if(sg) sg.onclick=()=>{ logActivity(); save(); P.session.n++; P.session.right++; resetQ(); renderPractice(); };
  const sa=$('sagain'); if(sa) sa.onclick=()=>{ P.phase="ask"; P.heard=null; renderPractice(); };
  // notes
  const ne=$('noteedit'); if(ne) ne.onclick=()=>{ P.noteEdit=true; renderPractice(); const i=$('noteinp'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); } };
  const ns=$('notesave'); if(ns){ const saveNote=()=>{ const v=$('noteinp').value.trim(); if(v) S.notes[P.cur.id]=v; else delete S.notes[P.cur.id]; save(); P.noteEdit=false; renderPractice(); }; ns.onclick=saveNote; $('noteinp').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); saveNote(); } }; }
  // tone follow-up
  const tq=$('tq'); if(tq) tq.onclick=e=>{ const b=e.target.closest('.chip'); if(!b||P.tq!=null) return; P.tq=b.dataset.t; const ok=P.tq===P.cur.tone; const r=S.tone[P.cur.id]||{ok:0,bad:0}; ok?r.ok++:r.bad++; S.tone[P.cur.id]=r; save(); renderPractice(); };
}
function submitAnswer(val){
  const w=P.cur; P.typed=val;
  const v = P.sub==="read" ? checkEn(w,val)
          : P.sub==="listen" ? (checkEn(w,val)!=="bad"?checkEn(w,val):checkThai(w,val))
          : checkThai(w,val);
  P.toneMiss=(P.sub==="type"&&lastToneMiss);
  finish(v);
}
function finish(v){
  const ok=v!=="bad"; record(P.cur.id,ok,curDir()); P.session.n++; if(ok) P.session.right++;
  if(isReview() && ok) { S.review.right++; save(); }
  P.verdict=v; P.phase="done"; renderPractice();
  if(navigator.vibrate) navigator.vibrate(ok?15:[30,40,30]);
}

function learnPool(){
  let p=L.day==="All"?WORDS:WORDS.filter(w=>w.day===L.day);
  if(L.q){ const q=L.q.toLowerCase(); p=p.filter(w=>w.en.toLowerCase().includes(q)||w.rom.toLowerCase().includes(q)||w.th.includes(q)||skeleton(w.rom).includes(skeleton(q))||(w.alt||[]).some(a=>a.includes(q))); }
  return p;
}
function badge(w){
  const s=st(w.id);
  if(s.seen===0) return `<span class="badge b-new">new</span>`;
  if(known(w.id)) return `<span class="badge b-solid">solid</span>`;
  if(halfKnown(w.id)) return `<span class="badge b-solid" style="opacity:.75">½ solid</span>`;
  if(s.wrong>0 && s.streak<2) return `<span class="badge b-weak">${s.wrong}✗</span>`;
  return `<span class="badge b-learn">learning</span>`;
}
function renderLearn(){
  const p=learnPool();
  let html=`
    <div class="seg" id="lseg"><button data-v="cards" class="${L.view==='cards'?'active':''}">Flashcards</button><button data-v="list" class="${L.view==='list'?'active':''}">Word list</button></div>
    <div class="chips" id="dchips"><button class="chip ${L.day==='All'?'active':''}" data-d="All">All ${WORDS.length}</button>${DAYS().map(d=>`<button class="chip ${L.day===d?'active':''}" data-d="${d}">Day ${d}</button>`).join('')}</div>

//  SENTENCE GENERATOR  (feeds Build → Tiles / Type it)

const pk=a=>a.length?a[Math.floor(Math.random()*a.length)]:null;

const POS=p=>WORDS.filter(w=>G(w).pos===p);

const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

const WHO=()=>({id:'khrai',s:'who',o:'who',be:'is',n:3});

function finalizeSent(c){ // optional khráp at the end (English unchanged — the prompt shows a "+ khráp" hint), stable progress key

function sentScore(c){

  const nd=NEWEST_DAY(); let need=0;

}
function genSentence(){

function newSentence(){

  const tiles=s.ids.map((id,k)=>({id,k}));
  if(S.settings.distractor){ const others=WORDS.filter(w=>!s.ids.includes(w.id)); const d=others[Math.floor(Math.random()*others.length)]; if(d) tiles.push({id:d.id,k:-1}); }

const sentTh=s=>s.ids.map(id=>BY_ID[id].th).join('');
const sentRom=s=>s.ids.map(id=>BY_ID[id].rom).join(' ');

// Match a freely typed romanised sentence word-by-word (spaces/hyphens ignored). Returns per-word marks ok|close|bad.
function matchSentence(ids,input){

    const w=BY_ID[id]; const cands=[...new Set([...romAlts(w),w.rom].map(skeleton).filter(Boolean))].sort((a,b)=>b.length-a.length);
    let hit=null;
    for(let k=0;k<=Math.min(10,rem.length) && !hit;k++){ // allow some junk before the word

        const seg=rem.slice(k,k+c.length);

//  TONES (identify the tone)
// ---------------------------------------------------------------------
function toneMisses(id){ const t=S.tone[id]||{ok:0,bad:0}; return t.bad; }
function toneWeight(w){ return 1 + st(w.id).wrong*1.5 + toneMisses(w.id)*3 + (isWeak(w.id)?2:0); }
function tonePool(){ const all=WORDS.filter(w=>!w.tone.includes('+')); return T.filter==="missed"?all.filter(w=>isWeak(w.id)||toneMisses(w.id)>0):all; }
function pickTone(pool){ // weighted random, avoiding an immediate repeat
  const cand=pool.length>1?pool.filter(w=>w!==T.last):pool; const tot=cand.reduce((a,w)=>a+toneWeight(w),0); let r=Math.random()*tot;
  for(const w of cand){ r-=toneWeight(w); if(r<=0) return w; } return cand[cand.length-1];
}
function renderTones(){
  const pool=tonePool();
  if(!pool.length){ stage().innerHTML=`<div class="seg" id="tseg"><button data-f="all">All words</button><button data-f="missed" class="active">Missed</button></div><div class="empty">No missed words to drill 🎉<br>Words you get wrong (or whose tone you mis-pick) collect here.</div>`;
    $('tseg').querySelectorAll('button').forEach(b=>b.onclick=()=>{ T.filter=b.dataset.f; T.cur=null; renderTones(); }); return; }
  if(!T.cur){ T.cur=pickTone(pool); T.phase="ask"; T.pick=null; }
  const w=T.cur; const done=T.phase!=="ask"; const voice=hasThaiVoice();
  const nMissed=WORDS.filter(w=>!w.tone.includes('+')&&(isWeak(w.id)||toneMisses(w.id)>0)).length;
  const html=`
    <div class="seg" id="tseg"><button data-f="all" class="${T.filter!=='missed'?'active':''}">All words</button><button data-f="missed" class="${T.filter==='missed'?'active':''}">Missed ${nMissed}</button></div>
    <div class="barlabel"><span>Which tone is it?</span><span>${T.right}/${T.n}</span></div>
    <div class="bar jade"><i style="width:${T.n?T.right/T.n*100:0}%"></i></div>
    <div class="card pop">
      <div class="prompt th">${esc(w.th)}</div>
      <div class="sub">${esc(w.en)}${done?` · <span style="color:var(--gold)">${esc(w.rom)}</span>`:''}</div>
      ${voice?`<button class="listen big" id="tplay">🔊</button>`:`<div class="sub" style="margin-top:12px">Look at the tone marks in the Thai script (and the reference below) — no Thai voice on this device.</div>`}
      <div class="tonegrid" id="tgrid">${TONES.map(t=>`<button class="tonebtn ${done&&t.key===w.tone?'ok':''} ${done&&T.pick===t.key&&t.key!==w.tone?'bad':''}" data-t="${t.key}" ${done?'disabled':''}>${t.label} <span class="mark" style="color:var(--gold)">${t.mark}</span><small>${t.desc}</small></button>`).join('')}</div>
      ${done?`<div class="row"><button class="btn gold" id="tnext">Next →</button></div>`:''}
    </div>
    <details class="toneref"><summary>Tone reference & how the marks work</summary>
      <table>${TONES.map(t=>{ const ex=pool.filter(x=>x.tone===t.key).slice(0,2); return `<tr><td>${t.label} <span class="mark">${t.mark}</span></td><td>${t.desc}<br><span style="color:var(--muted)">${ex.map(x=>`<span class="thai" style="font-size:18px">${esc(x.th)}</span> ${esc(x.rom)}`).join(' · ')}</span></td></tr>`; }).join('')}</table>
      <p>In the romanisation, the little mark over the vowel <b>is</b> the tone: none = mid, <b>à</b> low, <b>â</b> falling, <b>á</b> high, <b>ǎ</b> rising. Thai has 5 tones and they change meaning: <span class="thai" style="font-size:16px">ไม่</span> mâi (falling) = not, but <span class="thai" style="font-size:16px">ไหม</span> mǎi (rising) = question marker! When you type answers, tones are optional — but try to say them out loud.</p>
    </details>`;
  stage().innerHTML=html;
  $('tseg').querySelectorAll('button').forEach(b=>b.onclick=()=>{ T.filter=b.dataset.f; T.cur=null; renderTones(); });
  const play=$('tplay'); if(play){ play.onclick=()=>speak(w.th); if(!done&&S.settings.autoplay) setTimeout(()=>speak(w.th),150); }
  if(!done) $('tgrid').onclick=e=>{ const b=e.target.closest('.tonebtn'); if(!b) return; T.pick=b.dataset.t; T.phase="done"; T.n++; const ok=T.pick===w.tone; if(ok) T.right++; const r=S.tone[w.id]||{ok:0,bad:0}; ok?r.ok++:r.bad++; S.tone[w.id]=r; logActivity(); save(); if(navigator.vibrate) navigator.vibrate(ok?15:[30,40,30]); renderTones(); };
  else $('tnext').onclick=()=>{ T.last=T.cur; T.cur=null; renderTones(); };
  renderStat();
}

// ---------------------------------------------------------------------
//  PROGRESS
// ---------------------------------------------------------------------
function renderProgress(){
  const total=WORDS.length; let solid=0,learning=0,weak=0,fresh=0,right=0,wrong=0;
  WORDS.forEach(w=>{ const s=st(w.id); right+=s.right; wrong+=s.wrong; if(s.seen===0) fresh++; else if(known(w.id)) solid++; else if(s.wrong>0) weak++; else learning++; });
  const acc=right+wrong?Math.round(right/(right+wrong)*100):0;
  const due=WORDS.filter(w=>isDue(w.id)).length;
  const dirRow=DIRS.map(d=>{ let s_=0,l=0,wk=0; WORDS.forEach(w=>{ const x=stD(w.id,d); if(x.seen===0) return; if(knownD(w.id,d)) s_++; else if(x.wrong>0) wk++; else l++; }); return {d,s:s_,l,wk}; });
  const days=DAYS().map(dn=>{ const ws=WORDS.filter(w=>w.day===dn); let s_=0,l=0,wk=0; ws.forEach(w=>{ const x=st(w.id); if(x.seen===0) return; if(known(w.id)) s_++; else if(x.wrong>0) wk++; else l++; }); return {dn,n:ws.length,s:s_,l,wk}; });
  // heatmap: last 16 weeks ending today, columns = weeks, rows = Mon..Sun
  const today=new Date(); today.setHours(0,0,0,0);
  const dow=(today.getDay()+6)%7; // Mon=0
  const start=new Date(today); start.setDate(today.getDate()-dow-7*15);
  let cells=""; const d=new Date(start);
  while(d<=today){ const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; const n=S.activity[k]||0;
    const lvl=n>=S.settings.goal?3:n>=Math.ceil(S.settings.goal/2)?2:n>0?1:0; cells+=`<i class="${lvl?'l'+lvl:''} ${k===todayKey()?'today':''}" title="${k}: ${n}"></i>`; d.setDate(d.getDate()+1); }
  const cats=CATS().map(c=>{ const ws=WORDS.filter(w=>w.cat===c); let s=0,l=0,wk=0; ws.forEach(w=>{const x=st(w.id); if(x.seen===0)return; if(known(w.id))s++; else if(x.wrong>0)wk++; else l++;}); return {c,n:ws.length,s,l,wk}; });
  const weakList=WORDS.filter(w=>isWeak(w.id)).sort((a,b)=>(st(b.id).wrong-st(b.id).right)-(st(a.id).wrong-st(a.id).right)).slice(0,12);
  const sd=streakDays();
  const allTime=Object.values(S.activity).reduce((a,n)=>a+(n||0),0), activeDays=Object.values(S.activity).filter(n=>n>0).length;
  const wordAnswers=WORDS.reduce((a,w)=>a+st(w.id).seen,0);
  const html=`
    <div class="grid4">
      <div class="kpi"><b>🔥${sd}</b><span>day streak</span></div>
      <div class="kpi"><b>${todayCount()}</b><span>today / ${S.settings.goal}</span></div>
      <div class="kpi"><b>${acc}%</b><span>accuracy</span></div>
      <div class="kpi"><b>${due}</b><span>due now</span></div>
    </div>
    <div class="grid2">
      <div class="kpi"><b>${allTime.toLocaleString()}</b><span>answers all-time · any direction</span></div>
      <div class="kpi"><b>${wordAnswers.toLocaleString()}</b><span>word translations · ${activeDays} active day${activeDays===1?'':'s'}</span></div>
    </div>
    <div class="panel"><h2>Activity · last 16 weeks</h2><div class="heat">${cells}</div>
      <div class="legend"><span><i style="background:var(--surface2)"></i>none</span><span><i style="background:rgba(231,178,76,.35)"></i>some</span><span><i style="background:rgba(231,178,76,.6)"></i>half goal</span><span><i style="background:var(--gold)"></i>goal</span></div></div>
    <div class="panel"><h2>By day · tap a day to drill it</h2>
      ${days.map(x=>`<div class="mrow" data-day="${x.dn}" style="cursor:pointer"><div class="n">Day ${x.dn}${x.dn===NEWEST_DAY()?' ·':''}</div><div class="stack"><i class="s" style="width:${x.s/x.n*100}%"></i><i class="l" style="width:${x.l/x.n*100}%"></i><i class="w" style="width:${x.wk/x.n*100}%"></i></div><div class="c">${x.s}/${x.n}</div></div>`).join('')}
      <div class="mrow" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px"><div class="n">Daily review</div><div class="stack" style="background:transparent"><span style="font-size:12px;color:var(--muted)">${reviewDoneToday()?'done today ✓':S.review&&S.review.date===todayKey()?`${S.review.i}/${S.review.queue.length} in progress`:'not started today'}</span></div><div class="c"><button class="link" id="goreview" style="padding:0">open →</button></div></div>
    </div>
    <div class="panel"><h2>Vocabulary · ${solid} solid, ${learning} learning, ${weak} weak, ${fresh} new</h2>
      <div class="note" style="font-size:12px;color:var(--muted);margin-bottom:6px">“Solid” now means both ways: EN → Thai <b>and</b> Thai → EN.</div>
      ${dirRow.map(x=>`<div class="mrow"><div class="n">${DIR_LABEL[x.d]}</div><div class="stack"><i class="s" style="width:${x.s/total*100}%"></i><i class="l" style="width:${x.l/total*100}%"></i><i class="w" style="width:${x.wk/total*100}%"></i></div><div class="c">${x.s}/${total}</div></div>`).join('')}
      <div class="mrow"><div class="n">All words</div><div class="stack"><i class="s" style="width:${solid/total*100}%"></i><i class="l" style="width:${learning/total*100}%"></i><i class="w" style="width:${weak/total*100}%"></i></div><div class="c">${solid}/${total}</div></div>
      ${cats.map(x=>`<div class="mrow"><div class="n">${esc(x.c)}</div><div class="stack"><i class="s" style="width:${x.s/x.n*100}%"></i><i class="l" style="width:${x.l/x.n*100}%"></i><i class="w" style="width:${x.wk/x.n*100}%"></i></div><div class="c">${x.s}/${x.n}</div></div>`).join('')}
      <div class="legend"><span><i style="background:var(--jade)"></i>solid</span><span><i style="background:var(--gold)"></i>learning</span><span><i style="background:var(--clay)"></i>weak</span></div></div>
    <div class="panel"><h2>Weak words</h2>${weakList.length?`<div class="list">`+weakList.map(w=>`<div class="item" data-say="${esc(w.th)}"><div class="thai">${esc(w.th)}</div><div class="en">${esc(w.en)}<small>missed ${st(w.id).wrong}× · ${esc(w.tone)}</small></div><div class="rom">${esc(w.rom)}</div><button>🔊</button></div>`).join('')+`</div><div class="row"><button class="btn miss" id="drillweak">Drill weak words →</button></div>`:`<div class="empty" style="padding:14px">No weak words right now 🎉</div>`}</div>
    <div class="panel"><h2>Settings</h2>
      <div class="setrow"><span>Daily goal</span><select id="goal">${[10,20,30,50,100].map(g=>`<option ${S.settings.goal===g?'selected':''}>${g}</option>`).join('')}</select></div>
      <div class="setrow"><span>Auto-play audio</span><button class="toggle ${S.settings.autoplay?'on':''}" id="autoplay" aria-label="toggle autoplay"></button></div>
      <div class="setrow"><span>Extra distractor tile in Build</span><button class="toggle ${S.settings.distractor?'on':''}" id="distractor" aria-label="toggle distractor"></button></div>
      <div class="setrow"><span>Hard mode <small style="color:var(--muted)">EN → Thai needs the tone marks (hông-náam, not hong naam)</small></span><button class="toggle ${S.settings.hard?'on':''}" id="hard" aria-label="toggle hard mode"></button></div>
      <div class="setrow"><span>Old words in daily review</span><select id="reviewOld">${[5,10,15,20,30].map(g=>`<option ${S.settings.reviewOld===g?'selected':''}>${g}</option>`).join('')}</select></div>
      <div class="setrow"><span>Speech speed <small style="color:var(--muted)">${S.settings.rate.toFixed(1)}×</small></span><input type="range" id="rate" min="0.5" max="1.2" step="0.1" value="${S.settings.rate}"></div>
      <div class="setrow"><span>Test Thai voice</span><button class="small" id="testvoice">🔊 สวัสดีครับ</button></div>
    </div>
    <div class="panel"><h2>Your data</h2>
      <div class="row" style="margin-top:0"><button class="small" id="export">Export</button><button class="small" id="copylink">Copy link</button><button class="small" id="import">Import</button><button class="small danger" id="reset">Reset progress</button></div>
      <div class="note" style="font-size:12px;color:var(--muted);margin-top:8px">“Copy link” puts your whole progress into a URL — open it on your phone/laptop and tap Import there.</div>
      <textarea class="io" id="io" placeholder="Export puts your progress here as JSON — copy it to move to another device. Paste JSON here and press Import to restore." style="display:none"></textarea>
    </div>`;
  stage().innerHTML=html;
  $('goal').onchange=e=>{ S.settings.goal=+e.target.value; save(); renderProgress(); };
  $('autoplay').onclick=()=>{ S.settings.autoplay=!S.settings.autoplay; save(); renderProgress(); };
  $('distractor').onclick=()=>{ S.settings.distractor=!S.settings.distractor; save(); B.cur=null; renderProgress(); };
  $('hard').onclick=()=>{ S.settings.hard=!S.settings.hard; save(); renderProgress(); };
  $('reviewOld').onchange=e=>{ S.settings.reviewOld=+e.target.value; save(); };
  document.querySelectorAll('.mrow[data-day]').forEach(r=>r.onclick=()=>{ P.day=+r.dataset.day; setMode("today"); });
  $('goreview').onclick=()=>{ P.day="review"; setMode("today"); };
  $('copylink').onclick=async()=>{ try{ const url=await exportLink(); await navigator.clipboard.writeText(url); toast('Link copied — open it on the other device'); }catch(e){ const io=$('io'); io.style.display='block'; io.value=await exportLink(); io.select(); toast('Copy the link from the box'); } };
  $('rate').oninput=e=>{ S.settings.rate=+e.target.value; save(); e.target.previousElementSibling.querySelector('small').textContent=S.settings.rate.toFixed(1)+'×'; };
  $('rate').onchange=()=>speak('สวัสดีครับ');
  $('testvoice').onclick=()=>speak('สวัสดีครับ');
  document.querySelectorAll('.item[data-say]').forEach(it=>it.onclick=()=>speak(it.dataset.say));
  const dw=$('drillweak'); if(dw) dw.onclick=()=>{ P.filter="Weak"; P.cur=null; P.phase="ask"; setMode("practice"); };
  $('export').onclick=()=>{ const io=$('io'); io.style.display='block'; io.value=JSON.stringify(S); io.select(); try{ navigator.clipboard.writeText(io.value); toast('Copied to clipboard'); }catch(e){} };
  $('import').onclick=()=>{ const io=$('io'); if(io.style.display==='none'){ io.style.display='block'; io.value=''; io.placeholder='Paste your exported JSON here, then press Import again.'; io.focus(); return; }
    try{ importState(JSON.parse(io.value)); toast('Progress imported'); renderProgress(); }catch(e){ toast('That is not valid export data'); } };
  $('reset').onclick=()=>{ if(!confirm('Reset all progress on this device? This cannot be undone.')) return; S={v:3,stats:{},activity:{},sent:{},pat:{},tone:{},notes:{},review:null,settings:S.settings}; save(); P={...P,cur:null,phase:"ask",session:{n:0,right:0}}; B={...B,cur:null,right:0,n:0,pn:0,pright:0}; T={...T,cur:null,right:0,n:0}; toast('Progress reset'); renderProgress(); };
  renderStat();
}

// ---------------------------------------------------------------------
//  TRANSFER (copy-link export / import)
// ---------------------------------------------------------------------
function importState(j){ if(!j||typeof j!=='object'||!j.stats) throw 0; if(!j.v||j.v<3) j=migrate(j); S={...S,...j,settings:{...DEFAULT_SETTINGS,...(j.settings||{})}}; save(); }
const b64u=u8=>btoa(String.fromCharCode(...u8)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
async function exportLink(){
  const raw=new TextEncoder().encode(JSON.stringify(S)); let body, tag='j';
  if(window.CompressionStream){ const cs=new CompressionStream('deflate-raw'); const w=cs.writable.getWriter(); w.write(raw); w.close(); body=new Uint8Array(await new Response(cs.readable).arrayBuffer()); tag='z'; } else body=raw;
  return location.origin+location.pathname+'#import='+tag+b64u(body);
}
async function decodeLink(h){
  const tag=h[0], data=unb64u(h.slice(1)); let bytes=data;
  if(tag==='z'){ const ds=new DecompressionStream('deflate-raw'); const w=ds.writable.getWriter(); w.write(data); w.close(); bytes=new Uint8Array(await new Response(ds.readable).arrayBuffer()); }
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function checkImportLink(){
  const m=location.hash.match(/^#import=(.+)$/); if(!m) return;
  history.replaceState(null,'',location.pathname);
  let j; try{ j=await decodeLink(m[1]); if(!j.stats) throw 0; }catch(e){ toast('That import link is not valid'); return; }
  const n=Object.keys(j.stats).length, days=Object.keys(j.activity||{}).length;
  const b=$('banner'); b.style.display='block';
  b.innerHTML=`Import progress from this link? <b>${n}</b> words with history, <b>${days}</b> active days. This replaces what is on this device.<div class="row" style="margin-top:8px"><button class="small" id="impno">Ignore</button><button class="small" id="impyes" style="background:var(--gold);color:var(--ink)">Import</button></div>`;
  $('impno').onclick=()=>{ b.style.display='none'; };
  $('impyes').onclick=()=>{ try{ importState(j); toast('Progress imported'); b.style.display='none'; P.scope=null; render(); }catch(e){ toast('Import failed'); } };
}

// ---------------------------------------------------------------------
//  ROUTER
// ---------------------------------------------------------------------
const FOOT={
  today:"Daily review = due words from earlier days + today's words, both directions, one pass. Or pick a single day to drill.",
  practice:"Type the answer, then Check. Romanised spelling is matched leniently (khao / kao / khâao all count). Each direction is tracked separately — a word is solid only when you own it both ways.",
  learn:"Flip cards by tapping, swipe for next. Use the search to look up any word.",
  build:"Sentences are generated fresh from your word bank — endless variety, always translated. Tiles = put the words in order. Type it = write the whole sentence yourself. Patterns = learn the frame, swap the slot. Thai word order is mostly Subject–Verb–Object; question particles (ไหม) go at the end.",
  tones:"Thai has 5 tones — the same syllable with a different tone is a different word. Words you miss come up more often; “Missed” drills only those.",
  progress:"Progress is saved in this browser only. Export it to move to another device."
};
function setMode(m){
  mode=m; document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
  $('foot').textContent=FOOT[m]||"";
  render(); window.scrollTo({top:0});
}
function render(){
  if(mode==="practice"||mode==="today") renderPractice();
  else if(mode==="learn") renderLearn();
  else if(mode==="build") renderBuild();
  else if(mode==="tones") renderTones();
  else renderProgress();
}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));

// keyboard shortcut: Enter on verdict = next
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  if(document.activeElement && document.activeElement.tagName==='INPUT') return;
  const n=$('next')||$('bnext')||$('pnext')||$('tnext'); if(n){ e.preventDefault(); n.click(); }
});

load(); setMode("today"); checkImportLink();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
