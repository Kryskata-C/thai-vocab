// ---- drill: only the words the audit flagged, always English → Thai (you see the English and type the Thai). It runs
//      in rounds: every word still in the pool is asked once; right → it leaves the pool, wrong → it stays and comes back
//      in the next round, after the whole round is through. Rounds repeat until nothing is left.
//      Answers are NOT recorded — no streak, no rescheduling.
//      a.drill = {ids, dir (of the audit it came from), pool {id:{…}} = words not yet answered right, queue (this round,
//      in order), miss (wrong this round), round, last, n, right}. A drill saved before rounds existed has only ids/pool:
//      drillRound() gives it a queue of everything still in its pool, so no stored word is dropped.
function drillStart(ids,dir){
  const a=AU(); ids=ids.filter(id=>BY_ID[id]); if(!ids.length) return;
  a.drill={ids,dir,pool:Object.fromEntries(ids.map(id=>[id,{s:0,o:0}])),queue:shuffle(ids.slice()),miss:[],round:1,last:null,n:0,right:0};
  a.boost=[...new Set([...ids,...a.boost])]; save();                           // …and they go to the top of the normal Practice queue
  A.dq=null; A.dphase="ask"; A.view="drill"; renderAudit(); window.scrollTo({top:0}); toast(`${ids.length} word${ids.length===1?'':'s'} also pushed to the top of Practice`);
}
// make the drill's round state consistent with its pool; the pool is the truth and is never shrunk here
function drillRound(d){
  const left=Object.keys(d.pool).filter(id=>BY_ID[id]), inPool=id=>left.includes(id);
  if(!d.round) d.round=1;
  d.miss=[...new Set((Array.isArray(d.miss)?d.miss:[]).filter(inPool))];
  const fresh=!Array.isArray(d.queue);
  d.queue=[...new Set((fresh?[]:d.queue).filter(inPool))];
  if(fresh || (!d.queue.length && !d.miss.length && left.length)) d.queue=shuffle(left.slice());   // old drill, or a pool word no list knows about
  else { const stray=left.filter(id=>!d.queue.includes(id)&&!d.miss.includes(id)); if(stray.length) d.queue.push(...shuffle(stray)); }
  return left;
}
function drillNextRound(d){ d.queue=shuffle(d.miss.slice()); d.miss=[]; d.round=(d.round||1)+1; save(); }
function drillCheck(q,val){ // the lenient Practice matcher: tones, punctuation, articles, hyphens/spaces don't matter — plus apostrophes
  const w=BY_ID[q.id]; if(q.type==="en2th") return checkThai(w,val)!=="bad";
  const t=normEn(val).replace(/'/g,'');
  return checkEn(w,val)!=="bad" || (!!t && enAlts(w).some(x=>x.replace(/'/g,'')===t)) || (q.type==="listen" && checkThai(w,val)!=="bad");
}
function drillSubmit(val){
  const d=AU().drill, q=A.dq; if(!d||!q||A.dphase!=="ask") return; const ok=drillCheck(q,val);
  A.dtyped=val; A.dok=ok; d.n++; d.last=q.id; d.queue=d.queue.filter(id=>id!==q.id);
  if(ok){ d.right++; delete d.pool[q.id]; } else if(!d.miss.includes(q.id)) d.miss.push(q.id);
  save(); A.dphase="done"; renderAudit(); if(navigator.vibrate) navigator.vibrate(ok?15:[30,40,30]);
}
function renderAuditDrill(){
  const a=AU(), d=a.drill, total=d.ids.length, left=drillRound(d);
  const on=(id,f)=>{ const b=$(id); if(b) b.onclick=f; };
  if(!left.length && A.dphase!=="done"){ // pool empty → finished
    const pct=d.n?Math.round(d.right/d.n*100):0;
    stage().innerHTML=`<div class="card pop"><div class="summary"><div class="big">${ic('check')}${total}</div><p>word${total===1?'':'s'} drilled back, English → Thai — each one answered right.<br>${d.n} answers · ${pct}% right · ${d.round} round${d.round===1?'':'s'}</p></div>
      <div class="row"><button class="btn ghost" id="ddone" style="flex:0 0 auto">Done</button><button class="btn gold" id="dreaudit">Re-audit these ${total} word${total===1?'':'s'} ${ic('arrow')}</button></div>
      <div class="hint">A re-audit times them again, cold, to confirm they stuck. They also stay at the top of Practice until you answer each one right there.</div></div>`;
    on('ddone',()=>{ a.drill=null; save(); A.view="setup"; renderAudit(); });
    on('dreaudit',()=>{ if(a.run&&A.confirm!=='over'){ A.confirm='over'; $('dreaudit').textContent='Replaces your paused audit — tap again'; return; } a.drill=null; auditStart(d.ids,"recheck",d.dir); });
    return;
  }
  if(!d.queue.length && A.dphase!=="done"){ // the round is through → the words still wrong, and another round on just those
    const m=d.miss.map(id=>BY_ID[id]), k=m.length;
    stage().innerHTML=`<div class="card pop"><div class="summary"><div class="big">${k} still wrong</div><p>Round ${d.round} done · <b style="color:var(--cream)">${total-left.length}</b> of ${total} drilled back so far.<br>These ${k===1?'one comes':k+' come'} round again, English → Thai.</p></div>
      <div class="row"><button class="btn ghost" id="dleave" style="flex:0 0 auto">Later</button><button class="btn gold" id="dagain">Drill ${k===1?'it':'the '+k} again ${ic('arrow')}</button></div></div>
      <div class="list" style="margin-top:10px">${m.map(w=>`<div class="item" data-say="${esc(w.th)}"><div class="thai">${esc(w.th)}</div><div class="en">${esc(w.en)}</div><div class="rom">${esc(w.rom)}</div></div>`).join('')}</div>`;
    document.querySelectorAll('[data-say]').forEach(it=>it.onclick=()=>speak(it.dataset.say));
    on('dagain',()=>{ drillNextRound(d); A.dq=null; A.dphase="ask"; renderAudit(); window.scrollTo({top:0}); });
    on('dleave',()=>{ A.dq=null; A.view="setup"; renderAudit(); toast('Drill kept — continue any time'); });
    return;
  }
  if(A.dphase==="ask"&&(!A.dq||A.dq.id!==d.queue[0])) A.dq={id:d.queue[0],type:"en2th"};
  const q=A.dq, w=BY_ID[q.id], rn=d.queue.length+d.miss.length+(A.dphase==="done"&&A.dok?1:0), at=rn-d.queue.length;   // rn = words in this round
  let html=`<div class="barlabel"><span>Drill · EN → Thai · round ${d.round}</span><span><b style="color:var(--cream)">${left.length}</b> of ${total} left</span></div>
    <div class="bar jade"><i style="width:${rn?at/rn*100:0}%"></i></div><div class="card pop"><div class="prompt">${esc(w.en)}</div>`;
  if(A.dphase==="ask") html+=`<div class="sub">Type it in Thai — romanised or script, tones optional</div>
      <form class="field" id="dform" autocomplete="off"><input id="dans" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="your answer…" lang="th"><button class="go" type="submit" aria-label="Check">${ic('arrow')}</button></form>
      <div class="row links"><button class="link" id="dshow">${ic('eye')}Show answer</button><button class="link" id="dleave">Leave drill</button></div>`;
  else html+=`<div class="verdict ${A.dok?'ok':'bad'}">${vhead(A.dok?'ok':'bad')}
        ${plate(esc(w.th),romHtml(w),{say:w.th,tone:w.tone})}
        <div class="note">${esc(w.en)}${A.dtyped?` · you typed “${esc(A.dtyped)}”`:''}${noteOf(w.id)?`<br><i>${esc(noteOf(w.id))}</i>`:''}</div>
        <div class="note" style="margin-top:6px">${A.dok?'out of the pool':'comes back after this round'} · ${d.queue.length} to go in round ${d.round}</div></div>
      <div class="row act">${A.dok?'':`<button class="btn got" id="dover">I was right</button>`}<button class="btn gold" id="dnext">Next ${ic('arrow')}</button></div>`;
  html+=`</div>`;
  stage().innerHTML=html;
  const f=$('dform'); if(f){ f.onsubmit=e=>{ e.preventDefault(); drillSubmit($('dans').value); }; $('dans').focus({preventScroll:true}); }
  else if(S.settings.autoplay) speak(w.th);
  on('dshow',()=>drillSubmit(''));
  on('dleave',()=>{ A.dq=null; A.view="setup"; renderAudit(); toast('Drill kept — continue any time'); });
  on('dover',()=>{ d.miss=d.miss.filter(id=>id!==q.id); delete d.pool[q.id]; d.right++; A.dok=true; save(); renderAudit(); });   // matcher was too strict → the word leaves the pool
  on('dnext',()=>{ A.dq=null; A.dphase="ask"; renderAudit(); });
}

  const acc=right+wrong?Math.round(right/(right+wrong)*100):0;
  const due=WORDS.filter(w=>isDue(w.id)).length;
  const dirRow=DIRS.map(d=>{ let s_=0,l=0,wk=0; WORDS.forEach(w=>{ const x=stD(w.id,d); if(x.seen===0) return; if(knownD(w.id,d)) s_++; else if(x.wrong>0) wk++; else l++; }); return {d,s:s_,l,wk}; });

    const lvl=n>=S.settings.goal?3:n>=Math.ceil(S.settings.goal/2)?2:n>0?1:0; cells+=`<i class="${lvl?'l'+lvl:''} ${k===todayKey()?'today':''}" title="${k}: ${n}"></i>`; d.setDate(d.getDate()+1); }

  const html=`

      <div class="legend"><span><i class="h0"></i>none</span><span><i class="h1"></i>some</span><span><i class="h2"></i>half goal</span><span><i class="h3"></i>goal</span></div></div>

      <div class="mrow" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px"><div class="n">Daily review</div><div class="rest">${reviewDoneToday()?'done today':S.review&&S.review.date===todayKey()?`${S.review.i}/${S.review.queue.length} in progress`:'not started today'}</div><div class="c" style="width:auto"><button class="link" id="goreview" style="padding-right:0">open${ic('next')}</button></div></div>

function importState(j){ if(!j||typeof j!=='object'||!j.stats) throw 0; if(!j.v||j.v<3) j=migrate(j); S={...S,...j,settings:{...DEFAULT_SETTINGS,...(j.settings||{})}}; save(); }
const b64u=u8=>btoa(String.fromCharCode(...u8)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
async function exportLink(){
  const raw=new TextEncoder().encode(JSON.stringify(S)); let body, tag='j';
  if(window.CompressionStream){ const cs=new CompressionStream('deflate-raw'); const w=cs.writable.getWriter(); w.write(raw); w.close(); body=new Uint8Array(await new Response(cs.readable).arrayBuffer()); tag='z'; } else body=raw;
  return location.origin+location.pathname+'#import='+tag+b64u(body);
}
async function decodeLink(h){
  const tag=h[0], data=unb64u(h.slice(1)); let bytes=data;
  if(tag==='z'){ const ds=new DecompressionStream('deflate-raw'); const w=ds.writable.getWriter(); w.write(data); w.close(); bytes=new Uint8Array(await new Response(ds.readable).arrayBuffer()); }
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function checkImportLink(){
  const m=location.hash.match(/^#import=(.+)$/); if(!m) return;
  history.replaceState(null,'',location.pathname);
  let j; try{ j=await decodeLink(m[1]); if(!j.stats) throw 0; }catch(e){ toast('That import link is not valid'); return; }
  const n=Object.keys(j.stats).length, days=Object.keys(j.activity||{}).length;
  const b=$('banner'); b.style.display='block';
  b.innerHTML=`Import progress from this link? <b>${n}</b> words with history, <b>${days}</b> active days. This replaces what is on this device.<div class="row" style="margin-top:8px"><button class="small" id="impno">Ignore</button><button class="small go2" id="impyes">Import</button></div>`;
  $('impno').onclick=()=>{ b.style.display='none'; };
  $('impyes').onclick=()=>{ try{ importState(j); toast('Progress imported'); b.style.display='none'; P.scope=null; render(); }catch(e){ toast('Import failed'); } };
}

// ---------------------------------------------------------------------
//  ROUTER
// ---------------------------------------------------------------------
const FOOT={
  today:"Daily review = due words from earlier days + today's words, both directions, one pass. Or pick a single day to drill — open Focus to boost the words giving you trouble.",
  practice:"Type the answer, then Check. Romanised spelling is matched leniently (khao / kao / khâao all count). Each direction is tracked separately — a word is solid only when you own it both ways.",
  learn:"Flip cards by tapping, swipe for next. Use the search to look up any word.",
  build:"Sentences are generated fresh from your word bank — endless variety, always translated. EN → Thai: Tiles = put the Thai words in order, Type it = write the whole sentence yourself. Thai → EN: read the Thai and give the English (tiles or typed; wording is forgiven). Patterns = learn the frame, swap the slot. Thai word order is mostly Subject–Verb–Object; question particles (ไหม) go at the end.",
  tones:"Thai has 5 tones — the same syllable with a different tone is a different word. Words you miss come up more often; “Missed” drills only those.",
  audit:"One pass over every word after time away: type the answer, press Enter, next word. Wrong or blank = forgotten; for right answers the time until you start typing is the signal: under 3 s solid, 3–6 s shaky, over 6 s forgotten. Matching is lenient, as in Practice. Audits and drills never touch your streak or review schedule.",
  test:"Readiness check: every word of a day, typed both ways, plus a few sentences — no hints, no audio, one shot, timed. Ends with a verdict: ready, almost, or not ready to add new words. Words that took you noticeably longer are flagged as slow.",
  progress:"Progress is saved in this browser only. Export it to move to another device."
};
// Five tabs. Two of them group several modes; the header shows the members of the current group as text tabs.
const TABS=[["today","Today","day",["today"]],["practice","Practice","keys",["practice","build","tones"]],["learn","Learn","cards",["learn"]],["check","Check","clip",["test","audit"]],["progress","Progress","chart",["progress"]]];
const MODE_NAME={today:"Today",practice:"Words",build:"Sentences",tones:"Tones",learn:"Learn",test:"Test",audit:"Audit",progress:"Progress"};
const tabOf=m=>TABS.find(t=>t[3].includes(m));
const lastIn={};                                              // the mode you last used inside each tab
$('nav').innerHTML=TABS.map(([k,label,icon])=>`<button data-tab="${k}"><span class="pill">${ic(icon)}</span>${label}</button>`).join('');
$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{ const t=TABS.find(x=>x[0]===b.dataset.tab); setMode(tabOf(mode)===t?t[3][0]:(lastIn[t[0]]||t[3][0])); });
$('stat').onclick=()=>setMode('progress');
function renderTitle(){
  const t=tabOf(mode), ms=t[3], el=$('title');
  el.parentNode.parentNode.classList.toggle('tabs',ms.length>1);
  el.innerHTML=ms.length>1?ms.map(m=>`<button data-mode="${m}" class="${m===mode?'active':''}">${MODE_NAME[m]}</button>`).join(''):`<h1>${MODE_NAME[mode]}</h1>`;
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
}
function applyTheme(){ // auto follows the device; the top band colour also tints the browser chrome
  const t=S.settings.theme, r=document.documentElement;
  if(t==='light'||t==='dark') r.dataset.theme=t; else delete r.dataset.theme;
  const m=$('themecolor'); if(m) m.content=getComputedStyle(r).getPropertyValue('--band').trim()||'#1B3B9C';
}
function setMode(m){
  if(mode==="audit"&&m!=="audit") auditPause();
  mode=m; const t=tabOf(m); lastIn[t[0]]=m;
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t[0]));
  renderTitle();
  $('foot').textContent=FOOT[m]||"";
  render(); window.scrollTo({top:0});
}
function render(){
  if(mode==="practice"||mode==="today") renderPractice();
  else if(mode==="learn") renderLearn();
  else if(mode==="build") renderBuild();
  else if(mode==="tones") renderTones();
  else if(mode==="test") renderTest();
  else if(mode==="audit") renderAudit();
  else renderProgress();
}
// tapping a plate (or anything marked data-speak) says it
$('stage').addEventListener('click',e=>{ const p=e.target.closest('[data-speak]'); if(p) speak(p.dataset.speak); });
// every screen is rebuilt on each answer, which resets the scroll of its chip rows → keep the active chip in view
new MutationObserver(()=>document.querySelectorAll('#stage .chips:not(.wrapc)').forEach(c=>{ const a=c.querySelector('.chip.active'); if(a&&a.offsetLeft+a.offsetWidth>c.clientWidth-8) c.scrollLeft=a.offsetLeft-(c.clientWidth-a.offsetWidth)/2; })).observe($('stage'),{childList:true});
if(window.matchMedia) matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme);

// keyboard shortcut: Enter on verdict = next
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  if(document.activeElement && document.activeElement.tagName==='INPUT') return;
  const n=$('next')||$('bnext')||$('pnext')||$('tnext')||$('dnext'); if(n){ e.preventDefault(); n.click(); }
});

// a word you could keep staring at while the tab is hidden is not a fair timing → pause the audit
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&mode==='audit'&&A.live){ auditPause(); renderAudit(); } });

load(); applyTheme(); setMode("today"); checkImportLink();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
