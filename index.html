<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1B3B9C" id="themecolor" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Thai Vocab" />
<meta name="description" content="Learn Thai vocabulary by typing answers — typed recall, listening, sentence building, tone drills and progress tracking." />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<title>Thai Vocab</title>
<script>
// theme before first paint: auto follows the device, or the choice saved in Progress → Settings
try{ var t=(JSON.parse(localStorage.getItem('thai-vocab-v2')||'{}').settings||{}).theme; if(t==='light'||t==='dark') document.documentElement.dataset.theme=t; }catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&family=Overpass:wght@600..900&display=swap" rel="stylesheet">
<style>
  /* Look: a Bangkok street sign. Thai script sits on a blue plate with the romanisation under it, actions are taxi yellow,
     tones are drawn as their pitch contour. Light and dark follow the device (override in Progress → Settings). */
  :root{
    --bg:#EDF0F5; --surface:#FFFFFF; --surface2:#F2F4F9; --surface3:#E3E7F0; --line:rgba(17,26,56,.09); --line2:rgba(17,26,56,.17);
    --text:#0F1528; --muted:#59627D; --faint:#8A92AA;
    --band:#1B3B9C; --plate:#1B3B9C; --plate-edge:#132C7A; --on-plate-dim:rgba(255,255,255,.8);
    --accent:#FFC92E; --accent-edge:#E0A800; --on-accent:#1B1500;
    --rom:#1B3B9C; --focus:#1B3B9C; --bar:#1B3B9C;
    --ok:#12875A; --ok-bg:#E1F4EA; --ok-text:#0B6644;
    --bad:#D13B33; --bad-bg:#FBE8E6; --bad-text:#A8261F;
    --warn:#E0A100; --warn-bg:#FFF3D6; --warn-text:#8A5200;
    --heat1:#C3CEF3; --heat2:#7189DC; --heat3:#1B3B9C;
    --seg:#E3E7F0; --seg-on:#FFFFFF; --nav-bg:rgba(255,255,255,.94);
    --shadow:0 1px 2px rgba(17,26,56,.05),0 10px 28px -14px rgba(17,26,56,.22);
    --nav-h:62px;
    --display:'Overpass',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --ui:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif;
    --th:'IBM Plex Sans Thai Looped','Noto Sans Thai Looped','Noto Sans Thai',Thonburi,Tahoma,sans-serif;
    /* names the markup still uses */
    --cream:var(--text); --ink:var(--bg); --gold:var(--warn); --jade:var(--ok); --clay:var(--bad);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme=light]){
    --bg:#090D1A; --surface:#121830; --surface2:#19203E; --surface3:#242D54; --line:rgba(190,204,255,.1); --line2:rgba(190,204,255,.2);
    --text:#EEF1FB; --muted:#9BA5C6; --faint:#6B759C;
    --band:#14235C; --plate:#2347C2; --plate-edge:#183290;
    --accent:#FFCE3D; --accent-edge:#D9A616;
    --rom:#FFD666; --focus:#8EA6FF; --bar:#FFCE3D;
    --ok:#3DCB92; --ok-bg:rgba(61,203,146,.14); --ok-text:#93E9C5;
    --bad:#FF7265; --bad-bg:rgba(255,114,101,.14); --bad-text:#FFB5AD;
    --warn:#FFC247; --warn-bg:rgba(255,194,71,.13); --warn-text:#FFD98A;
    --heat1:rgba(255,206,61,.28); --heat2:rgba(255,206,61,.6); --heat3:#FFCE3D;
    --seg:#19203E; --seg-on:#2C3768; --nav-bg:rgba(15,20,42,.94);
    --shadow:none; color-scheme:dark;
  } }
  :root[data-theme=dark]{
    --bg:#090D1A; --surface:#121830; --surface2:#19203E; --surface3:#242D54; --line:rgba(190,204,255,.1); --line2:rgba(190,204,255,.2);
    --text:#EEF1FB; --muted:#9BA5C6; --faint:#6B759C;
    --band:#14235C; --plate:#2347C2; --plate-edge:#183290;
    --accent:#FFCE3D; --accent-edge:#D9A616;
    --rom:#FFD666; --focus:#8EA6FF; --bar:#FFCE3D;
    --ok:#3DCB92; --ok-bg:rgba(61,203,146,.14); --ok-text:#93E9C5;
    --bad:#FF7265; --bad-bg:rgba(255,114,101,.14); --bad-text:#FFB5AD;
    --warn:#FFC247; --warn-bg:rgba(255,194,71,.13); --warn-text:#FFD98A;
    --heat1:rgba(255,206,61,.28); --heat2:rgba(255,206,61,.6); --heat3:#FFCE3D;
    --seg:#19203E; --seg-on:#2C3768; --nav-bg:rgba(15,20,42,.94);
    --shadow:none; color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{height:100%;-webkit-text-size-adjust:100%;background:var(--band)}
  body{background:var(--bg);color:var(--text);font-family:var(--ui);font-size:15px;line-height:1.4;min-height:100dvh;
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
  button{font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer}
  input,select,textarea{font-family:inherit}
  :focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
  b{font-weight:650}
  .ic{width:1.25em;height:1.25em;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.24em}
  /* tone contours: the pitch shape of each syllable */
  .tg{display:inline-flex;gap:4px;vertical-align:middle;color:var(--rom)}
  .tg svg{width:22px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--faint);vertical-align:1px}
  .dot.ok{background:var(--ok)}.dot.close{background:var(--warn)}.dot.bad{background:var(--bad)}

  /* top band: the page title (or the tabs of a group) on sign blue */
  .top{background:var(--band);color:#fff;padding-top:env(safe-area-inset-top)}
  .top-in{max-width:560px;margin:0 auto;padding:10px 16px 30px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:86px}
  .title{display:flex;align-items:baseline;gap:clamp(12px,4.4vw,20px);min-width:0}
  .title h1,.title button{font-family:var(--display);font-weight:800;font-size:clamp(22px,6.6vw,27px);letter-spacing:-.01em;line-height:1.1;white-space:nowrap}
  .title button{font-size:clamp(18px,5.5vw,24px)}
  .title button{background:none;border:0;padding:8px 0 9px;color:rgba(255,255,255,.5);position:relative;transition:color .15s}
  .title h1{padding:8px 0 9px}
  .title button.active{color:#fff}
  .title button.active::after{content:"";position:absolute;left:0;right:0;bottom:1px;height:3px;border-radius:3px;background:var(--accent)}
  .stat{display:flex;align-items:center;gap:7px;flex:0 0 auto;background:rgba(255,255,255,.13);border:0;color:#fff;border-radius:999px;
    padding:8px 13px 8px 10px;min-height:38px;font-size:13px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
  .stat .ic{color:var(--accent);width:17px;height:17px;vertical-align:0}
  .stat i{font-style:normal;font-weight:500;opacity:.72}
  .top.tabs .stat i{display:none}
  .sheet{background:var(--bg);border-radius:22px 22px 0 0;margin-top:-20px;position:relative;
    padding:16px 14px calc(var(--nav-h) + 30px + env(safe-area-inset-bottom));min-height:calc(100dvh - 66px)}
  .wrap{max-width:560px;margin:0 auto}

  /* bottom nav */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--nav-bg);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
    border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:flex;justify-content:center}
  .nav-inner{display:flex;width:100%;max-width:560px}
  .nav button{flex:1;min-width:0;border:0;background:transparent;color:var(--faint);font-size:11px;font-weight:600;letter-spacing:.01em;
    display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;transition:color .15s}
  .nav .pill{position:relative;display:grid;place-items:center;width:56px;height:30px;border-radius:15px;transition:background .18s,color .18s}
  .nav .ic{width:23px;height:23px;vertical-align:0}
  .nav button.active{color:var(--text)}
  .nav button.active .pill{background:var(--plate);color:#fff}
  .nav button.due .pill::after{content:"";position:absolute;top:2px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}

  /* chips + segmented controls */
  .chips{position:relative;display:flex;gap:7px;overflow-x:auto;margin:0 -14px 2px;padding:0 14px 10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips.wrapc{flex-wrap:wrap;justify-content:center;overflow:visible;margin:0;padding:0}
  .chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:0;background:var(--surface);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line2);
    font-size:13.5px;font-weight:600;padding:0 14px;height:36px;border-radius:18px;transition:background .15s,color .15s;flex:0 0 auto}
  .chip .ic{width:15px;height:15px;vertical-align:0}
  .chip.active{background:var(--text);color:var(--bg);box-shadow:none}
  .chip.jade.active{background:var(--ok);color:#fff}
  .chip.clay.active{background:var(--bad);color:#fff}
  .chip.swap{background:var(--plate);color:#fff;box-shadow:inset 0 -2px 0 var(--plate-edge)}
  .chip:disabled{cursor:default}
  .card .chips:not(.wrapc){margin:16px -18px 0;padding:0 18px 2px}
  .seg{display:flex;gap:2px;background:var(--seg);border-radius:14px;padding:3px;margin-bottom:12px}
  .seg button{flex:1;min-width:0;border:0;background:transparent;color:var(--muted);font-size:13.5px;font-weight:600;padding:0 4px;border-radius:11px;height:38px;transition:background .15s,color .15s;white-space:nowrap}
  .seg button.active{background:var(--seg-on);color:var(--text);box-shadow:0 1px 3px rgba(10,16,40,.14)}

  /* cards */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px 18px 20px;margin-top:4px;text-align:center;box-shadow:var(--shadow)}
  .card.info{text-align:left;padding:22px 18px 20px}
  .card.info .prompt{font-size:clamp(24px,7vw,28px)}
  .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
  .prompt{font-family:var(--display);font-weight:800;font-size:clamp(27px,8.2vw,35px);letter-spacing:-.015em;line-height:1.14;overflow-wrap:anywhere;text-wrap:balance}
  .prompt small{font-family:var(--ui);letter-spacing:0}
  .prompt.rom{font-family:var(--ui);font-weight:650;font-size:clamp(28px,8.6vw,38px);color:var(--rom);letter-spacing:-.01em}
  .sub{font-size:13.5px;color:var(--muted);margin-top:10px;line-height:1.5;text-wrap:pretty}
  .sub b,.note b{color:var(--text)}
  .thai{font-family:var(--th);font-weight:500;font-size:38px;line-height:1.35}
  .rom{font-size:17px;color:var(--rom);font-weight:550}
  .rom small{display:block;font-size:.76em;font-weight:450;opacity:.78;margin-top:1px}
  .prompt.rom small{font-size:.46em;font-weight:500;margin-top:5px}
  .tone{font-size:12px;color:var(--muted)}

  /* the sign plate */
  .plate{position:relative;background:var(--plate);color:#fff;border-radius:16px;padding:20px 18px 17px;margin:14px 0 0;box-shadow:inset 0 -3px 0 var(--plate-edge);text-align:center}
  .plate::before{content:"";position:absolute;inset:5px;border:1.5px solid rgba(255,255,255,.5);border-radius:11px;pointer-events:none}
  .plate .thai{font-size:clamp(34px,10.5vw,46px);font-weight:600;line-height:1.3;color:#fff;overflow-wrap:anywhere}
  .plate .rom{color:var(--on-plate-dim);font-size:18px;font-weight:550;letter-spacing:.01em;margin-top:1px}
  .plate .tg{color:var(--accent);margin-top:8px}
  .plate.long .thai{font-size:clamp(24px,7.4vw,30px);line-height:1.45}
  .plate.long .rom{font-size:16px}
  .plate[data-speak]{cursor:pointer}
  .plate .pl-say{position:absolute;top:13px;right:13px;width:20px;height:20px;opacity:.75}
  .card>.plate:first-child,.card>.eyebrow+.plate{margin-top:0}

  .row{display:flex;gap:10px;margin-top:16px}
  .row.links{justify-content:center;gap:4px;margin-top:8px}
  /* the main action of a drill card: sticks above the tab bar when the card is taller than the screen */
  .row.act{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px);z-index:5;margin:2px -18px -20px;padding:14px 18px 20px;
    background:linear-gradient(to bottom,transparent,var(--surface) 24%);border-radius:0 0 24px 24px}
  .btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;min-height:54px;padding:8px 18px;border-radius:17px;
    font-size:16px;font-weight:650;line-height:1.2;transition:transform .12s,filter .15s,opacity .15s}
  .btn:active{transform:scale(.975)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn small{font-weight:500;opacity:.72;font-size:12.5px}
  .btn.fit{flex:0 0 auto}
  .ghost{background:var(--surface2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
  .gold{background:var(--accent);color:var(--on-accent);box-shadow:inset 0 -3px 0 var(--accent-edge)}
  .got{background:var(--ok-bg);color:var(--ok-text)}
  .miss{background:var(--bad-bg);color:var(--bad-text)}
  .listen{flex:0 0 auto;display:grid;place-items:center;width:54px;height:54px;border-radius:17px;border:0;background:var(--surface2);color:var(--rom);box-shadow:inset 0 0 0 1px var(--line2);font-size:19px}
  .listen.big{width:84px;height:84px;border-radius:50%;background:var(--plate);color:#fff;box-shadow:inset 0 -4px 0 var(--plate-edge);margin:4px auto 0;font-size:30px;transition:transform .12s}
  .listen.big:active{transform:scale(.95)}
  .listen.live{background:var(--bad);box-shadow:none;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}
  .row .listen.big{margin:0}
  .tq{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .tkeys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
  .tkeys .chip{flex-direction:column;justify-content:center;gap:3px;height:56px;padding:0;border-radius:14px;font-size:12px}
  .tkeys .chip .tg{color:inherit}

  /* typed answer */
  .field{position:relative;margin-top:18px;display:flex;gap:8px}
  .field input{flex:1;min-width:0;height:58px;background:var(--surface2);border:2px solid transparent;box-shadow:inset 0 0 0 1px var(--line2);color:var(--text);
    font-size:19px;font-weight:500;padding:0 62px 0 18px;border-radius:18px;outline:none;text-align:left;transition:border-color .15s,background .15s}
  .field input:focus{border-color:var(--focus);background:var(--surface);box-shadow:none}
  .field input.ok{border-color:var(--ok)}
  .field input.bad{border-color:var(--bad)}
  .field input::placeholder{color:var(--faint);font-weight:400}
  .field .go{position:absolute;right:7px;top:7px;width:44px;height:44px;border-radius:13px;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:19px;box-shadow:inset 0 -2px 0 var(--accent-edge)}
  .field .go:active{transform:scale(.94)}
  .field.plain input{height:50px;font-size:16px;padding:0 14px;border-radius:15px}
  .field.plain .btn{flex:0 0 auto;min-height:50px;border-radius:15px;font-size:15px}
  .verdict{margin-top:16px;text-align:center;line-height:1.5}
  .verdict h3{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:6px 13px 6px 10px;border-radius:999px}
  .verdict h3 .ic{width:15px;height:15px;stroke-width:2.6;vertical-align:0}
  .verdict.ok h3{background:var(--ok-bg);color:var(--ok-text)}
  .verdict.close h3{background:var(--warn-bg);color:var(--warn-text)}
  .verdict.bad h3{background:var(--bad-bg);color:var(--bad-text)}
  .verdict .thai{font-size:34px}
  .verdict .rom{font-size:17px}
  .verdict .answer{font-family:var(--display);font-weight:800;font-size:clamp(26px,7.6vw,32px);line-height:1.15;letter-spacing:-.01em;overflow-wrap:anywhere;margin-top:12px;text-wrap:balance}
  .verdict .note{font-size:13px;color:var(--muted);margin-top:10px}
  .verdict .note .tg svg{width:18px;height:13px}
  .verdict .note.tip{text-align:left;background:var(--surface2);border-radius:12px;padding:10px 12px;color:var(--text)}
  .verdict .note.tip .ic{color:var(--warn);width:16px;height:16px}
  .mynote{display:flex;align-items:center;justify-content:center;gap:2px 6px;flex-wrap:wrap;margin-top:6px!important}
  .mynote span{font-style:italic;color:var(--text)}
  .verdict.box{border-radius:18px;padding:18px 16px}
  .verdict.box.ok{background:var(--ok-bg)}.verdict.box.close{background:var(--warn-bg)}.verdict.box.bad{background:var(--bad-bg)}
  .verdict.box h3{background:none;padding:0;font-size:14px;gap:8px}
  .hintline{margin-top:10px;font-size:13px;color:var(--muted);min-height:19px}
  .hintline:empty{display:none}
  .link{display:inline-flex;align-items:center;gap:6px;background:transparent;border:0;color:var(--muted);font-size:13.5px;font-weight:550;padding:8px 10px;border-radius:10px;min-height:40px}
  .link .ic{width:16px;height:16px;vertical-align:0}
  .link:active{background:var(--surface2)}

  /* progress bar */
  .bar{height:5px;background:var(--surface3);border-radius:5px;overflow:hidden;margin:6px 0 12px}
  .bar i{display:block;height:100%;background:var(--bar);border-radius:5px;transition:width .3s}
  .bar.jade i{background:var(--ok)}
  .barlabel{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:550;color:var(--muted);font-variant-numeric:tabular-nums;padding:0 2px}
  .barlabel .ic{width:13px;height:13px;vertical-align:-.16em}

  /* lists */
  .list{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
  .item{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"thai rom badge btn" "en en badge btn";align-items:center;column-gap:10px;row-gap:0;
    padding:10px 8px 10px 14px;border-top:1px solid var(--line);cursor:pointer;text-align:left;min-height:56px}
  .item:first-child{border-top:0}
  .item .thai{grid-area:thai;font-family:var(--th);font-size:21px;font-weight:500;line-height:1.3}
  .item .rom{grid-area:rom;font-size:14px;color:var(--rom);font-weight:550;overflow-wrap:anywhere}
  .item .en{grid-area:en;font-size:14px;min-width:0}
  .item .en small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
  .item .en small .tg svg{width:16px;height:11px}
  .item .badge{grid-area:badge}
  .item>button{grid-area:btn;display:grid;place-items:center;background:transparent;border:0;color:var(--rom);width:40px;height:40px;border-radius:12px;font-size:17px}
  .item>.rom:last-child,.item>.badge:last-child{margin-right:6px}
  .item.on{box-shadow:inset 3px 0 0 var(--accent)}
  .panel .list,.dayref .list,.toneref .list{border:0;border-radius:0;background:none;margin:0 -2px 6px}
  .panel .item,.dayref .item,.toneref .item{padding-left:2px;padding-right:0}
  .badge{font-size:11px;padding:3px 8px;border-radius:999px;font-weight:650;white-space:nowrap}
  .b-weak{background:var(--bad-bg);color:var(--bad-text)}
  .b-solid{background:var(--ok-bg);color:var(--ok-text)}
  .b-new{background:var(--surface3);color:var(--text)}
  .b-learn{background:var(--surface2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
  .search{width:100%;height:48px;background:var(--surface);border:2px solid transparent;box-shadow:inset 0 0 0 1px var(--line2);color:var(--text);font-size:16px;padding:0 16px;border-radius:15px;outline:none;margin-bottom:10px;-webkit-appearance:none;appearance:none}
  .search:focus{border-color:var(--focus);box-shadow:none}
  .search::placeholder{color:var(--faint)}

  /* flashcard: English on paper, flips to the sign */
  .flash{perspective:1200px;margin-top:4px}
  .flash .inner{position:relative;min-height:300px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
  .flash.flipped .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);

function migrate(j){ // v2 stats were flat (one record per word, from EN → Thai drills) → move them under .th
  const out={}; Object.entries(j.stats||{}).forEach(([id,x])=>{ out[id]=("seen" in x)?{th:{...blank(),...x},en:blank()}:x; }); j.stats=out; j.v=3; return j;
}
function load(){ try{const r=localStorage.getItem(KEY); if(r){let j=JSON.parse(r); if(!j.v||j.v<3) j=migrate(j); S={...S,...j,settings:{...DEFAULT_SETTINGS,...(j.settings||{})}};}}catch(e){} }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
function stD(id,dir){ return (S.stats[id]&&S.stats[id][dir])||blank(); }
function st(id){ // merged view across both directions (for badges, totals, weak lists)
  const a=stD(id,"th"), b=stD(id,"en"); const seen=[a,b].filter(x=>x.seen>0);
  return {right:a.right+b.right,wrong:a.wrong+b.wrong,seen:a.seen+b.seen,streak:Math.min(a.streak,b.streak),
          due:seen.length?Math.min(...seen.map(x=>x.due||0)):0,last:Math.max(a.last,b.last)};
}
const todayKey=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
function logActivity(){ const k=todayKey(); S.activity[k]=(S.activity[k]||0)+1; }
const INTERVALS=[0,1,3,7,14,30,60]; // days between reviews by streak
function record(id,ok,dir){
  dir=dir||"th"; const s=stD(id,dir); s.seen++; s.last=Date.now();
  if(ok){ s.right++; s.streak=(s.streak||0)+1; s.due=Date.now()+INTERVALS[Math.min(s.streak,INTERVALS.length-1)]*864e5; }
  else { s.wrong++; s.streak=0; s.due=Date.now(); }
  if(ok && S.audit && S.audit.boost) S.audit.boost=S.audit.boost.filter(x=>x!==id); // recovered → no longer pushed to the top (see Audit)
  S.stats[id]={...(S.stats[id]||{}),[dir]:s}; logActivity(); save();
}
function knownD(id,dir){ const s=stD(id,dir); return s.right>=3 && s.streak>=2; }
function isWeakD(id,dir){ const s=stD(id,dir); return s.wrong>0 && !knownD(id,dir); }
function isDueD(id,dir){ const s=stD(id,dir); return s.seen>0 && (s.due||0)<=Date.now(); }
function known(id){ return knownD(id,"th") && knownD(id,"en"); }
function halfKnown(id){ return !known(id) && (knownD(id,"th") || knownD(id,"en")); }
function isWeak(id){ return DIRS.some(d=>isWeakD(id,d)); }
function isDue(id){ return DIRS.some(d=>isDueD(id,d)); }
function noteOf(id){ return (S.notes&&S.notes[id])||""; }
function todayCount(){ return S.activity[todayKey()]||0; }
function streakDays(){
  let n=0; const d=new Date(); const k=todayKey();
  if(!S.activity[k]) d.setDate(d.getDate()-1); // streak still alive if you practised yesterday
  for(;;){ const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if(S.activity[key]) { n++; d.setDate(d.getDate()-1); } else break; if(n>3650) break; }
  return n;
}

// =====================================================================
//  ANSWER MATCHING (lenient romanisation)
// =====================================================================
function skeleton(s){
  s=(s||"").toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  s=s.replace(/ʉ/g,'ue').replace(/ɛ/g,'ae').replace(/ɔ/g,'o').replace(/ə+/g,'oe').replace(/œ/g,'oe');
  s=s.replace(/[\s\-]+/g,'|').replace(/[^a-z|]/g,'');                   // keep word/syllable breaks as | so "yàak hǎa" is not read as "yaa-khaa" (kh), "rao wan" not as "ra-ow-an"
  s=s.replace(/kh/g,'k').replace(/ph/g,'p').replace(/th/g,'t').replace(/bp/g,'p').replace(/dt/g,'t').replace(/ch/g,'c').replace(/ck/g,'k').replace(/j/g,'c');
  s=s.replace(/g/g,'k').replace(/b/g,'p').replace(/d/g,'t');
  s=s.replace(/ar(?![aeiou])/g,'a').replace(/or(?![aeiou])/g,'o').replace(/er(?![aeiou])/g,'e').replace(/aw(?![aeiou])/g,'o').replace(/oe/g,'e')
     .replace(/eu/g,'u').replace(/ue/g,'u').replace(/ow/g,'ao').replace(/au/g,'ao').replace(/ay/g,'ai').replace(/ee/g,'i').replace(/oo/g,'u');
  s=s.replace(/\|/g,'').replace(/(.)\1+/g,'$1');                        // breaks dropped last: doubled letters still collapse across them ("wan-níi" → "wani")
  return s;
}
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); } prev=cur; }
  return prev[n];
}
function romAlts(w){ // "rʉ̌ʉ (reu)" -> ["rʉ̌ʉ","reu"]
  return w.rom.split(/[()/]/).map(x=>x.trim()).filter(Boolean);
}
// every accepted skeleton of a word: each spelling, with and without its hyphens ("phrɔ́-wâa" is typed both "phro-waa" and "phrowaa")
function romSkels(w){ const alts=romAlts(w); if(!alts.length) alts.push(w.rom); return [...new Set(alts.flatMap(r=>[skeleton(r),skeleton(r.replace(/-/g,''))]).filter(Boolean))]; }
// sequence of tone marks in a romanised string, e.g. "hông-náam" -> "^'"  (mid tone has no mark)
function toneSig(s){ return (s||"").normalize('NFD').replace(/[^\u0300\u0301\u0302\u030C]/g,'').replace(/\u0300/g,'`').replace(/\u0301/g,"'").replace(/\u0302/g,'^').replace(/\u030C/g,'v'); }
let lastToneMiss=false;
// returns "ok" | "close" | "bad"
function checkThai(w,input){
  lastToneMiss=false;
  const raw=(input||"").trim(); if(!raw) return "bad";
  if(raw.normalize('NFC')===w.th.normalize('NFC')) return "ok";
  const typed=skeleton(raw); if(!typed) return "bad";
  const targets=romSkels(w);
  if(targets.includes(typed)){
    if(S.settings.hard){ const sig=toneSig(raw); if(!romAlts(w).some(r=>toneSig(r)===sig)){ lastToneMiss=true; return "close"; } }
    return "ok";
  }
  if(targets.some(t=>t.length>=4 && lev(t,typed)<=1)) return "close";
  return "bad";
}
function normEn(s){ return (s||"").toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\b(to|the|a|an)\b/g,' ').replace(/\s+/g,' ').trim(); }
function enAlts(w){
  const out=new Set();
  let base=w.en.replace(/\([^)]*\)/g,'').trim();
  if(!base) base=w.en.replace(/[()]/g,'');
  base.split('/').forEach(p=>{ const n=normEn(p); if(n) out.add(n); });
  (w.alt||[]).forEach(a=>{ const n=normEn(a); if(n) out.add(n); });
  return [...out];
}
function checkEn(w,input){
  const t=normEn(input); if(!t) return "bad";
  const alts=enAlts(w);
  if(alts.includes(t)) return "ok";
  const tw=t.split(' ');
  // typed words are a subset of an alternative's words (e.g. "want" for "want to")
  if(alts.some(a=>{ const aw=a.split(' '); return tw.every(x=>aw.includes(x)); })) return "ok";
  if(alts.some(a=>a.length>=4 && lev(a,t)<=1)) return "close";
  return "bad";
}

// ---- STRICT matching for the Test tab. Missing tone marks are still fine, but a near-miss that is (or is closer to)
//      a different word in the bank is wrong, and typed tone marks that point at a different word are wrong too.
let SKEL_MAP=null, EN_MAP=null;
function skelMap(){ if(SKEL_MAP) return SKEL_MAP; const m={}; WORDS.forEach(w=>romSkels(w).forEach(k=>{ if(!k) return; (m[k]=m[k]||new Set()).add(w.id); })); return SKEL_MAP=m; }
function enMap(){ if(EN_MAP) return EN_MAP; const m={}; WORDS.forEach(w=>enAlts(w).forEach(a=>{ (m[a]=m[a]||new Set()).add(w.id); })); return EN_MAP=m; }
function checkThaiStrict(w,input){
  const raw=(input||"").trim(); if(!raw) return false;
  if(raw.normalize('NFC')===w.th.normalize('NFC')) return true;
  if(/[฀-๿]/.test(raw)) return false;                                   // Thai script, but not this word
  const typed=skeleton(raw); if(!typed) return false;
  const targets=romSkels(w), M=skelMap();
  if(targets.includes(typed)){
    const sig=toneSig(raw); if(!sig) return true;                       // no tone marks typed → accepted
    if(romAlts(w).some(r=>toneSig(r)===sig)) return true;              // right tone marks
    return ![...(M[typed]||[])].some(id=>id!==w.id && romAlts(BY_ID[id]).some(r=>toneSig(r)===sig)); // tones spell a different word → wrong
  }
  // one edit away from a 4+ letter target, and no other bank word is as close
  const d=Math.min(...targets.map(t=>lev(t,typed)));
  if(d>1 || typed.length<4 || !targets.some(t=>t.length>=4 && lev(t,typed)===d)) return false;
  return !Object.keys(M).some(k=>!M[k].has(w.id) && lev(k,typed)<=d);
}
function checkEnStrict(w,input){
  const t=normEn(input); if(!t) return false;
  const alts=enAlts(w), M=enMap();
  if(alts.includes(t)) return true;
  if(M[t]) return false;                                                 // exactly another word's meaning
  const tw=t.split(' ');
  if(alts.some(a=>{ const aw=a.split(' '); return aw.length===tw.length && tw.every(x=>aw.includes(x)); })) return true;   // same words, other order
  if(alts.some(a=>{ const aw=a.split(' '); return aw.length>1 && tw.length>=Math.ceil(aw.length/2) && tw.every(x=>aw.includes(x)); })) return true; // "located" for "be located"
  if(t.length>=4){ const d=Math.min(...alts.map(a=>lev(a,t))); if(d<=1 && !Object.keys(M).some(a=>!M[a].has(w.id) && lev(a,t)<=d)) return true; } // a typo, and no other word as close
  return false;
}

// ---- tone contours: the pitch shape of a syllable, one curve per syllable ("falling+rising" → two)
const TONE_PATH={mid:"M3 9h18",low:"M3 10c6 .5 12 2 18 4.5",falling:"M3 7.5c3-2.5 6.5-2.5 9.5 0 3.5 3 6 5.5 8.5 7",high:"M3 9c6 0 12-1.5 18-5.5",rising:"M3 13c4.5 1.2 8.5.5 11.5-2.5 2.5-2.5 4.5-5.5 6.5-7.5"};
const toneGlyph=t=>`<span class="tg" aria-hidden="true">${String(t||'').split('+').map(k=>TONE_PATH[k]?`<svg viewBox="0 0 24 18"><path d="${TONE_PATH[k]}"/></svg>`:'').join('')}</span>`;
// ---- the sign plate: Thai on blue, romanisation under it, tone contours last. th / rom arrive escaped.
//      o.say = Thai text spoken when the plate is tapped (left out where audio would give the answer away)
const plate=(th,rom,o={})=>`<div class="plate${o.cls?' '+o.cls:''}"${o.say?` data-speak="${esc(o.say)}" role="button" tabindex="0" aria-label="Listen"`:''}>${o.say?ic('speaker','pl-say'):''}<div class="thai">${th}</div>${rom?`<div class="rom">${rom}</div>`:''}${o.tone?toneGlyph(o.tone):''}</div>`;
const romMain=w=>romAlts(w)[0]||w.rom;
const romHtml=w=>{ const a=romAlts(w); return esc(a[0]||w.rom)+(a.length>1?`<small>${esc(a.slice(1).join(' / '))}</small>`:''); };
const VHEAD={ok:['check','Correct'],close:['approx','Close enough'],bad:['x','Not quite']};
const vhead=(v,label)=>`<h3>${ic(VHEAD[v][0])}${label||VHEAD[v][1]}</h3>`;
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1600); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const CATS=()=>[...new Set(WORDS.map(w=>w.cat))];
const DAYS=()=>[...new Set(WORDS.map(w=>w.day))].sort((a,b)=>a-b);
const NEWEST_DAY=()=>Math.max(...DAYS()); // "today" = the latest day in the word bank
const TODAY_DAY=()=>DAYS().includes(P.day)?P.day:NEWEST_DAY(); // day selected in the Today tab (defaults to newest)

function renderStat(){
  const total=WORDS.length,k=WORDS.filter(w=>known(w.id)).length, sd=streakDays();
  $('stat').innerHTML=`${ic('flame')}${sd}<i>${k}/${total} solid</i>`; $('stat').title=`${sd} day streak · ${k} of ${total} words solid`;
  const nt=document.querySelector('.nav [data-tab="today"]'); if(nt) nt.classList.toggle('due',!reviewDoneToday()); // the daily review is still waiting
}

// ---------------------------------------------------------------------
//  PRACTICE (typed recall)  — also drives the Today tab and its daily review
// ---------------------------------------------------------------------
const SUBS=[["type","EN→Thai"],["listen","Listen"],["read","Rom→EN"],["shadow","Speak"]];
// which memory direction a drill trains:  type/shadow = produce Thai (th),  listen/read = recognise Thai (en)
const subDir=sub=>(sub==="type"||sub==="shadow")?"th":"en";
const curDir=()=>subDir(P.sub);
const isReview=()=>mode==="today" && P.day==="review";
function practicePool(){
  if(isReview()) return WORDS;
  if(mode==="today") return WORDS.filter(w=>w.day===TODAY_DAY());
  const d=curDir();
  if(P.filter==="Due") return WORDS.filter(w=>isDueD(w.id,d));
  if(P.filter==="Weak") return WORDS.filter(w=>isWeakD(w.id,d));
  if(P.filter==="New") return WORDS.filter(w=>stD(w.id,d).seen===0);
  if(P.filter==="Test") return WORDS.filter(w=>(P.testIds||[]).includes(w.id)); // words missed in the last graded test
  if(P.filter==="Audit") return WORDS.filter(w=>auditBoost().includes(w.id));   // words lost in the last audit, until answered right once
  if(P.filter==="All") return WORDS;
  return WORDS.filter(w=>w.cat===P.filter);
}
const focusIds=()=>(S.focus||{})[TODAY_DAY()]||[];
function priority(w,dir){
  const s=stD(w.id,dir); let p=Math.random()*2;
  if(s.seen===0) p+=4;                          // new words come early
  if(s.seen>0 && (s.due||0)<=Date.now()) p+=6;  // due for review
  p+=s.wrong*2 - s.streak;                      // weak words rise, solid words sink
  if(s.last && Date.now()-s.last<60e3) p-=8;    // avoid immediate repeats
  if(auditBoost().includes(w.id)) p+=20;        // lost in an audit → top of the queue until answered right
  if(mode==="today" && P.day!=="review" && focusIds().includes(w.id)) p+=5; // focused words surface more; others stay in the mix
  return p;
}
function pickNext(){ const p=practicePool(); if(!p.length) return null; const d=curDir(); return p.slice().sort((a,b)=>priority(b,d)-priority(a,d))[0]; }

// ---- daily review queue: due words from earlier days (weaker direction first) + every word of the newest day, both directions
function reviewQueue(){
  const nd=NEWEST_DAY(), old=[], bs=auditBoost();
  WORDS.filter(w=>w.day<nd).forEach(w=>{
    const b=bs.includes(w.id), dirs=DIRS.filter(d=>isDueD(w.id,d));
    if(!dirs.length){ if(!b) return; dirs.push(...DIRS); }                       // lost in an audit → reviewed first, even when not due
    const dir=dirs.sort((a,b)=>(stD(w.id,b).wrong-stD(w.id,b).streak)-(stD(w.id,a).wrong-stD(w.id,a).streak))[0];
    old.push({id:w.id,dir,p:(b?100:0)+stD(w.id,dir).wrong*2-stD(w.id,dir).streak+Math.random()});
  });
  old.sort((a,b)=>b.p-a.p);
  const q=old.slice(0,S.settings.reviewOld).map(({id,dir})=>({id,dir}));
  WORDS.filter(w=>w.day===nd).forEach(w=>{ q.push({id:w.id,dir:"th"}); q.push({id:w.id,dir:"en"}); });
  return shuffle(q);
}
function ensureReview(){
  const k=todayKey();
  if(!S.review || S.review.date!==k || !Array.isArray(S.review.queue)){ S.review={date:k,queue:reviewQueue(),i:0,right:0,done:false}; save(); }
  return S.review;
}
function reviewDoneToday(){ const r=S.review; return !!(r && r.date===todayKey() && r.done); }

function renderPractice(){
  const goal=S.settings.goal, tc=todayCount();
  const todayMode=mode==="today", review=isReview(), scope=review?"today:review":todayMode?"today:"+TODAY_DAY():"all";
  if(P.scope!==scope){ P.scope=scope; P.cur=null; P.phase="ask"; P.hint=0; P.tq=null; P.noteEdit=false; }
  if(!review) P.sub=P.userSub;
  const R=review?ensureReview():null;
  if(review && P.phase==="ask"){ // the queue decides word + direction
    const item=R.queue[R.i];
    if(item){ P.cur=BY_ID[item.id]||null; P.sub=item.dir==="th"?"type":"read"; if(!P.cur){ R.i++; save(); return renderPractice(); } }
    else P.cur=null;
  }
  const listenOk = P.sub!=="listen" || hasThaiVoice() || !window.speechSynthesis;
  const filters=["All","Due","Weak","New",...((P.testIds||[]).length?["Test"]:[]),...(auditBoost().length||P.filter==="Audit"?["Audit"]:[]),...CATS()];
  const cnt=f=>{ const old=P.filter; P.filter=f; const n=practicePool().length; P.filter=old; return n; };
  const refs=todayMode?todayRefs(R):'';
  let html=review?'':`
    <div class="seg" id="subseg">${SUBS.map(([k,l])=>`<button data-sub="${k}" class="${P.sub===k?'active':''}">${l}</button>`).join('')}</div>`;
  html+=`
    ${todayMode?todayChips():`<div class="chips" id="chips">${filters.map(f=>{
      const n=cnt(f); const cls=f==="Weak"||f==="Test"||f==="Audit"?"clay":f==="Due"?"jade":"";
      return `<button class="chip ${cls} ${f===P.filter?'active':''}" data-f="${f}">${f==="Test"?"Shaky from test":f==="Audit"?"Lost in audit":f}${["Due","Weak","New","Test","Audit"].includes(f)?` ${n}`:''}</button>`; }).join('')}</div>`}
    <div class="barlabel"><span>Today ${Math.min(tc,goal)}/${goal}${tc>=goal?' · goal reached':''}</span><span>${review?`Review ${Math.min(R.i,R.queue.length)}/${R.queue.length}`:`Session ${P.session.right}/${P.session.n}`}</span></div>
    <div class="bar ${tc>=goal?'jade':''}"><i style="width:${Math.min(100,tc/goal*100)}%"></i></div>`;

  if(review && R.i>=R.queue.length){ // finished today's queue
    if(!R.done){ R.done=true; save(); }
    const pct=R.queue.length?Math.round(R.right/R.queue.length*100):0;
    html+=`<div class="card pop"><div class="summary"><div class="big">${R.right}/${R.queue.length}</div><p>Daily review done · ${pct}% right<br>${R.queue.length?'':'Nothing was due — add words or come back tomorrow.'}</p></div>
      <div class="row"><button class="btn ghost" id="rebuild2">Rebuild queue</button><button class="btn gold" id="daycards2">Flashcards Day ${NEWEST_DAY()} ${ic('arrow')}</button></div></div>`;
    stage().innerHTML=html+refs; bindPractice(); renderStat(); return;
  }
  if(!P.cur) P.cur=pickNext();
  if(!P.cur){
    html+=`<div class="empty">${todayMode?`No words for Day ${TODAY_DAY()} yet.`:P.filter==="Due"?"Nothing due right now.<br>Come back later or practise another set.":P.filter==="Weak"?"No weak words.<br>Words you miss will show up here.":P.filter==="New"?"You've seen every word! Switch to All or Due.":P.filter==="Audit"?"Every word from the audit answered right.<br>Run a new audit when you want to check again.":"No words in this set yet."}</div>`;
    stage().innerHTML=html+refs; bindPractice(); renderStat(); return;
  }
  const w=P.cur;
  const isThaiAnswer = P.sub!=="read";
  const dirTag=review?`<div class="eyebrow">${DIR_LABEL[subDir(P.sub)]}</div>`:'';
  const ask=P.phase==="ask";
  const promptHtml = P.sub==="type" ? `${dirTag}<div class="prompt">${esc(w.en)}</div>${ask?`<div class="sub">Type it in Thai (romanised is fine, e.g. <i>khao</i>)${S.settings.hard?' — <b>hard mode: tone marks required</b>':' — tones optional'}</div>`:''}`
    : P.sub==="listen" ? `<button class="listen big" id="play" aria-label="play">${ic('speaker')}</button><div class="sub">Listen, then type what it means (or the Thai word)${listenOk?'':'<br><b>No Thai voice on this device — showing the word instead:</b><br><span class="thai" style="font-size:30px">'+esc(w.th)+'</span>'}</div>`
    : P.sub==="read" ? `${dirTag}<div class="prompt rom">${romHtml(w)}</div>${ask?`<div class="sub">Type the meaning in English</div>`:''}`
    : `<div class="prompt">${esc(w.en)}</div><div class="rom" style="margin-top:6px;font-size:22px">${esc(w.rom)}</div><div class="sub">Listen, then say it out loud — copy the tone.</div>`;

  html+=`<div class="card pop">${promptHtml}`;
  if(P.sub==="shadow"){
    html+=shadowHtml(w);
  } else if(P.phase==="ask"){
    html+=`<form class="field" id="ansform" autocomplete="off"><input id="ans" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="${isThaiAnswer?'your answer…':'meaning in English…'}" ${P.sub==='read'?'':'lang="th"'}>
      <button class="go" type="submit" aria-label="Check">${ic('arrow')}</button></form>
      <div class="hintline" id="hintline">${hintText(w)}</div>
      <div class="row links"><button class="link" id="hint">${ic('bulb')}Hint</button><button class="link" id="show">${ic('eye')}Show answer</button></div>`;
  } else {
    const v=P.verdict, tqWait=v!=="ok" && !w.tone.includes('+') && P.tq==null; // tone follow-up still open → don't print its answer above it
    html+=`<div class="verdict ${v}">
        ${vhead(v,v==="close"&&P.toneMiss?"Right word, wrong tones":"")}
        ${P.sub==="read"?`<div class="answer">${esc(w.en)}</div>`:''}
        ${plate(esc(w.th),romHtml(w),{say:w.th,tone:tqWait?'':w.tone})}
        <div class="note">${[P.sub==="read"?'':esc(w.en),tqWait?'':`${esc(w.tone)} tone`,P.typed?`you typed “${esc(P.typed)}”`:''].filter(Boolean).join(' · ')}</div>
        ${noteHtml(w)}
        ${toneQuizHtml(w)}
      </div>
      <div class="row act">
        ${v==="bad"?`<button class="btn got" id="override">I was right</button>`:''}
        <button class="btn gold" id="next">Next ${ic('arrow')}</button></div>`;
  }
  html+=`</div>`;
  if(!review && P.session.n>0 && P.session.n%goal===0 && P.phase==="ask" && !P.done){
    P.done=true; toast(`Session: ${P.session.right}/${P.session.n} correct`);
  }
  stage().innerHTML=html+refs;
  bindPractice();
  if(P.sub==="shadow"){ if(P.phase==="ask" && S.settings.autoplay && hasThaiVoice()) setTimeout(()=>speak(w.th),150); }
  else if(P.phase==="ask"){ const inp=$('ans'); if(inp){ inp.focus({preventScroll:true}); } if(P.sub==="listen"&&S.settings.autoplay&&hasThaiVoice()) setTimeout(()=>speak(w.th),150); }
  else if(P.sub!=="listen" && S.settings.autoplay) speak(w.th);
  renderStat();
}
function todayChips(){ // newest day first: that is the one you open the app for
  const d=TODAY_DAY(), nd=NEWEST_DAY(), rev=P.day==="review";
  return `<div class="chips" id="daychips"><button class="chip jade ${rev?'active':''}" data-day="review">${ic(reviewDoneToday()?'check':'stack')}Daily review</button>${DAYS().slice().reverse().map(x=>`<button class="chip ${!rev&&x===d?'active':''}" data-day="${x}">Day ${x}${x===nd?' · today':''}</button>`).join('')}</div>`;
}
function todayRefs(R){ // reference lists under the drill card: the queue or the day's words, and the Focus picker
  const d=TODAY_DAY(), nd=NEWEST_DAY();
  if(P.day==="review"){
    const nOld=R.queue.filter(q=>BY_ID[q.id]&&BY_ID[q.id].day<nd).length, nNew=R.queue.length-nOld;
    return `<details class="dayref" id="dayref" ${P.dayOpen?'open':''}><summary><span>${ic('stack')}Today's queue · ${nOld} due + ${nNew} reps of Day ${nd}</span></summary>
      <div class="list">${R.queue.map((q,i)=>{ const w=BY_ID[q.id]; if(!w) return ''; return `<div class="item" data-say="${esc(w.th)}" style="${i<R.i?'opacity:.45':''}"><div class="thai">${esc(w.th)}</div><div class="en">${esc(w.en)}<small>${DIR_LABEL[q.dir]} · day ${w.day}${i<R.i?' · done':''}</small></div><div class="rom">${esc(w.rom)}</div>${badge(w)}</div>`; }).join('')}</div>
      <div class="row links"><button class="link" id="rebuild">${ic('refresh')}Rebuild queue</button></div></details>`;
  }
  const ws=WORDS.filter(w=>w.day===d), solid=ws.filter(w=>known(w.id)).length, foc=focusIds();
  return `<details class="dayref" id="dayref" ${P.dayOpen?'open':''}><summary><span>${ic('day')}Day ${d} · ${ws.length} words · ${solid} solid</span></summary>
    <div class="list">${ws.map(w=>`<div class="item" data-say="${esc(w.th)}"><div class="thai">${esc(w.th)}</div><div class="en">${esc(w.en)}<small>${toneGlyph(w.tone)} ${esc(w.tone)} · ${esc(w.cat)}${noteOf(w.id)?` · <i>${esc(noteOf(w.id))}</i>`:''}</small></div><div class="rom">${esc(w.rom)}</div>${badge(w)}<button aria-label="listen">${ic('speaker')}</button></div>`).join('')}</div>
    <div class="row links"><button class="link" id="daycards">${ic('cards')}Flashcards for Day ${d}</button></div></details>
  <details class="dayref" id="focusref" ${P.focusOpen?'open':''}><summary><span>${ic('target')}Focus${foc.length?` · ${foc.length} word${foc.length===1?'':'s'} boosted`:' the tricky ones'}</span></summary>
    <p>Tap the words giving you trouble — they'll come up more often. The rest of Day ${d} stays in the mix.</p>
    <div class="chips wrapc" id="focuschips">${ws.map(w=>`<button class="chip clay ${foc.includes(w.id)?'active':''}" data-fw="${w.id}">${esc(w.rom)} <span style="opacity:.7">· ${esc(w.en.split('/')[0].trim())}</span></button>`).join('')}</div>
    ${foc.length?`<div class="row links"><button class="link" id="focusclear">${ic('x')}Clear focus</button></div>`:''}</details>`;
}
// ---- shadow (speak) mode: listen → say it → reveal; optional speech recognition check
const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
function shadowHtml(w){
  const revealed=P.phase!=="ask";
  let h=`<div class="row" style="justify-content:center;gap:18px"><button class="listen big" id="play" aria-label="play">${ic('speaker')}</button>${SR?`<button class="listen big ${P.listening?'live':''}" id="mic" aria-label="say it">${ic('mic')}</button>`:''}</div>`;
  if(P.heard!=null) h+=`<div class="verdict ${P.heardOk?'ok':'bad'}" style="margin-top:12px"><h3>${P.heardOk?ic('check')+'Recognised':ic('x')+'Heard something else'}</h3><div class="thai" style="font-size:26px">${esc(P.heard||'…')}</div>${P.heardOk?'':`<div class="note">target: <span class="thai" style="font-size:18px">${esc(w.th)}</span> ${esc(w.rom)}</div>`}</div>`;
  else if(SR) h+=`<div class="sub" style="margin-top:6px">${P.listening?'Listening… say it now':'Tap the microphone and say the word — rough check only, the tone still needs your ear.'}</div>`;
  else h+=`<div class="sub" style="margin-top:6px">Speech recognition isn't available in this browser — just say it aloud.</div>`;
  if(revealed) h+=`<div class="verdict ok" style="margin-top:12px">${plate(esc(w.th),romHtml(w),{say:w.th,tone:w.tone})}<div class="note">${esc(w.tone)} tone</div>${noteHtml(w)}</div>
      <div class="row act"><button class="btn miss" id="sagain">${ic('refresh')}Again</button><button class="btn got" id="sgot">${ic('check')}Got it</button></div>`;
  else h+=`<div class="row act"><button class="btn gold" id="sreveal">Reveal Thai ${ic('arrow')}</button></div>`;
  return h;
}
function startListening(w){
  if(!SR || P.listening) return;
  try{
    const r=new SR(); r.lang="th-TH"; r.interimResults=false; r.maxAlternatives=3;
    P.listening=true; P.heard=null; renderPractice();
    r.onresult=e=>{ const alts=[...e.results[0]].map(x=>x.transcript.replace(/\s+/g,'').normalize('NFC')); const t=w.th.replace(/\s+/g,'').normalize('NFC');
      P.heard=alts[0]||''; P.heardOk=alts.some(a=>a===t||a.includes(t)||t.includes(a)&&a.length>=Math.max(1,t.length-1)); if(P.heardOk){ logActivity(); save(); } };
    r.onerror=()=>{ P.heard=P.heard||''; };
    r.onend=()=>{ P.listening=false; if(P.heard==null) P.heard=''; renderPractice(); };
    r.start();
  }catch(e){ P.listening=false; toast('Microphone not available'); }
}
// ---- notes (your own hook / mnemonic per word)
function noteHtml(w){
  const n=noteOf(w.id);
  if(P.noteEdit) return `<div class="field plain" style="margin-top:12px"><input id="noteinp" type="text" placeholder="e.g. water room = bathroom" value="${esc(n)}" maxlength="140"><button class="btn gold" id="notesave">Save</button></div>`;
  return `<div class="note mynote">${n?`<span>${esc(n)}</span>`:''}<button class="link" id="noteedit">${ic('pencil')}${n?'Edit note':'Add a note'}</button></div>`;
}
// ---- tone follow-up after a miss (single-tone words only)
function toneQuizHtml(w){
  if(P.verdict==="ok" || w.tone.includes('+')) return '';
  const done=P.tq!=null; const t=TONES.find(x=>x.key===w.tone);
  return `<div class="tq" id="tq"><div class="note" style="margin:0 0 8px">${done?(P.tq===w.tone?`<span class="yes">${ic('check')} Yes — ${t.label} tone</span>`:`<span class="no">${ic('x')} It's <b>${t.label}</b> (${t.mark})${TONES.find(x=>x.key===P.tq)?`, not ${TONES.find(x=>x.key===P.tq).label}`:''}</span>`):'Which tone was that?'}</div>
    <div class="tkeys">${TONES.map(x=>`<button class="chip ${done&&x.key===w.tone?'jade active':''} ${done&&x.key===P.tq&&x.key!==w.tone?'clay active':''}" data-t="${x.key}" ${done?'disabled':''}>${toneGlyph(x.key)}${x.label}</button>`).join('')}</div></div>`;
}
function hintText(w){
  if(!P.hint) return "";
  const alts=romAlts(w); const r=alts[alts.length-1]||w.rom;
  const syl=r.split(/[- ]/).length;
  if(P.sub==="read"){ const e=enAlts(w)[0]||""; return P.hint===1?`Starts with “${e[0]||'?'}…” · ${e.length} letters`:`${e.slice(0,Math.ceil(e.length/2))}…`; }
  return P.hint===1?`${syl} syllable${syl>1?'s':''} · starts with “${r[0]}”`:`${r.slice(0,Math.ceil(r.length/2))}…`;
}
function resetQ(){ P.cur=null; P.phase="ask"; P.hint=0; P.tq=null; P.noteEdit=false; P.heard=null; P.heardOk=false; P.toneMiss=false; }
function bindPractice(){
  const dch=$('daychips'); if(dch) dch.onclick=e=>{ const b=e.target.closest('.chip'); if(!b) return; P.day=b.dataset.day==="review"?"review":+b.dataset.day; renderPractice(); };
  const dr=$('dayref'); if(dr){ dr.ontoggle=()=>{ P.dayOpen=dr.open; }; dr.querySelectorAll('.item[data-say]').forEach(it=>it.onclick=()=>speak(it.dataset.say)); }
  const fr=$('focusref'); if(fr) fr.ontoggle=()=>{ P.focusOpen=fr.open; };
  const fc=$('focuschips'); if(fc) fc.onclick=e=>{ const b=e.target.closest('.chip'); if(!b) return; const d=TODAY_DAY(), id=b.dataset.fw; S.focus=S.focus||{}; const arr=S.focus[d]||[];
    S.focus[d]=arr.includes(id)?arr.filter(x=>x!==id):[...arr,id]; save(); renderPractice(); };
  const fcl=$('focusclear'); if(fcl) fcl.onclick=()=>{ const d=TODAY_DAY(); if(S.focus) delete S.focus[d]; save(); renderPractice(); toast('Focus cleared'); };
  const dc=$('daycards')||$('daycards2'); if(dc) dc.onclick=()=>{ L.day=P.day==="review"?NEWEST_DAY():TODAY_DAY(); L.view="cards"; L.idx=0; L.flipped=false; setMode("learn"); };
  ['rebuild','rebuild2'].forEach(id=>{ const rb=$(id); if(rb) rb.onclick=()=>{ S.review=null; ensureReview(); resetQ(); renderPractice(); toast('Queue rebuilt'); }; });
  const seg=$('subseg'); if(seg) seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{ P.userSub=P.sub=b.dataset.sub; resetQ(); renderPractice(); });
  const chips=$('chips'); if(chips) chips.onclick=e=>{ const b=e.target.closest('.chip'); if(!b) return; P.filter=b.dataset.f; resetQ(); renderPractice(); };
  const form=$('ansform'); if(form) form.onsubmit=e=>{ e.preventDefault(); submitAnswer($('ans').value); };
  const play=$('play'); if(play) play.onclick=()=>speak(P.cur.th);
  const mic=$('mic'); if(mic) mic.onclick=()=>startListening(P.cur);
  const hint=$('hint'); if(hint) hint.onclick=()=>{ P.hint=Math.min(2,P.hint+1); $('hintline').textContent=hintText(P.cur); };
  const show=$('show'); if(show) show.onclick=()=>{ P.typed=""; finish("bad"); };
  const next=$('next'); if(next) next.onclick=()=>{ if(isReview()){ S.review.i++; save(); } resetQ(); P.done=false; renderPractice(); };
  const ov=$('override'); if(ov) ov.onclick=()=>{ // undo the wrong mark, count as right
    const dir=curDir(), s=stD(P.cur.id,dir); s.wrong=Math.max(0,s.wrong-1); s.seen=Math.max(0,s.seen-1); S.stats[P.cur.id]={...(S.stats[P.cur.id]||{}),[dir]:s};

    record(P.cur.id,true,dir); P.session.n++; P.session.right++; P.verdict="ok"; P.tq=null; renderPractice(); };
  // shadow
  const sr=$('sreveal'); if(sr) sr.onclick=()=>{ P.phase="done"; renderPractice(); };
  const sg=$('sgot'); if(sg) sg.onclick=()=>{ logActivity(); save(); P.session.n++; P.session.right++; resetQ(); renderPractice(); };
  const sa=$('sagain'); if(sa) sa.onclick=()=>{ P.phase="ask"; P.heard=null; renderPractice(); };
  // notes
  const ne=$('noteedit'); if(ne) ne.onclick=()=>{ P.noteEdit=true; renderPractice(); const i=$('noteinp'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); } };
  const ns=$('notesave'); if(ns){ const saveNote=()=>{ const v=$('noteinp').value.trim(); if(v) S.notes[P.cur.id]=v; else delete S.notes[P.cur.id]; save(); P.noteEdit=false; renderPractice(); }; ns.onclick=saveNote; $('noteinp').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); saveNote(); } }; }
  // tone follow-up
  const tq=$('tq'); if(tq) tq.onclick=e=>{ const b=e.target.closest('.chip'); if(!b||P.tq!=null) return; P.tq=b.dataset.t; const ok=P.tq===P.cur.tone; const r=S.tone[P.cur.id]||{ok:0,bad:0}; ok?r.ok++:r.bad++; S.tone[P.cur.id]=r; save(); renderPractice(); };
}
function submitAnswer(val){
  const w=P.cur; P.typed=val;
  const v = P.sub==="read" ? checkEn(w,val)
          : P.sub==="listen" ? (checkEn(w,val)!=="bad"?checkEn(w,val):checkThai(w,val))
          : checkThai(w,val);

function finish(v){
  const ok=v!=="bad"; record(P.cur.id,ok,curDir()); P.session.n++; if(ok) P.session.right++;
  if(isReview() && ok) { S.review.right++; save(); }
  P.verdict=v; P.phase="done"; renderPractice();
  if(navigator.vibrate) navigator.vibrate(ok?15:[30,40,30]);
}

function learnPool(){
  let p=L.day==="All"?WORDS:WORDS.filter(w=>w.day===L.day);
  if(L.q){ const q=L.q.toLowerCase(); p=p.filter(w=>w.en.toLowerCase().includes(q)||w.rom.toLowerCase().includes(q)||w.th.includes(q)||skeleton(w.rom).includes(skeleton(q))||(w.alt||[]).some(a=>a.includes(q))); }
  return p;
}
function badge(w){
  const s=st(w.id);
  if(s.seen===0) return `<span class="badge b-new">new</span>`;
  if(known(w.id)) return `<span class="badge b-solid">solid</span>`;
  if(halfKnown(w.id)) return `<span class="badge b-solid" style="opacity:.75">½ solid</span>`;
  if(s.wrong>0 && s.streak<2) return `<span class="badge b-weak">missed ${s.wrong}×</span>`;
  return `<span class="badge b-learn">learning</span>`;
}

      </div></div>
      <div class="row"><button class="btn ghost" id="prev">${ic('prev')}Prev</button><button class="listen" id="lsay" aria-label="listen">${ic('speaker')}</button><button class="btn ghost" id="nxt">Next${ic('next')}</button></div>
      <div class="row" style="margin-top:10px"><button class="btn ghost" id="shuf">${L.shuf?ic('refresh')+'Reshuffle':ic('shuffle')+'Shuffle'}</button>${L.shuf?'<button class="btn ghost" id="unshuf">In order</button>':''}</div>

function bindLearn(){
  $('lseg').querySelectorAll('button').forEach(b=>b.onclick=()=>{ L.view=b.dataset.v; L.flipped=false; renderLearn(); });
  $('dchips').onclick=e=>{ const b=e.target.closest('.chip'); if(!b) return; L.day=b.dataset.d==="All"?"All":+b.dataset.d; L.idx=0; L.flipped=false; renderLearn(); };
  const q=$('q'); q.oninput=()=>{ L.q=q.value; L.idx=0; const pos=q.selectionStart; renderLearn(); const nq=$('q'); nq.focus(); nq.setSelectionRange(pos,pos); };
  const p=learnPool();
  const fl=$('flash'); if(fl){
    const cur=()=>L.shuf?BY_ID[L.order[L.pos]]:p[L.idx];
    const step=d=>{ // shuffled: walk the dealt order; finishing a round reshuffles so every card shows once per round
      if(L.shuf){ const n=L.order.length;
        if(d>0&&L.pos>=n-1){ const last=L.order[n-1]; L.order=shuffle(L.order.slice()); if(n>1&&L.order[0]===last) L.order.push(L.order.shift()); L.pos=0; toast(`All ${n} seen — reshuffled`); }
        else L.pos=(L.pos+d+n)%n; }
      else L.idx=(L.idx+d+p.length)%p.length;
      L.flipped=false; renderLearn(); };
    fl.onclick=()=>{ L.flipped=!L.flipped; fl.classList.toggle('flipped',L.flipped); if(L.flipped&&S.settings.autoplay) speak(cur().th); };
    $('prev').onclick=()=>step(-1);
    $('nxt').onclick=()=>step(1);
    $('lsay').onclick=()=>speak(cur().th);
    $('shuf').onclick=()=>{ const first=L.shuf?cur().id:null; L.shuf=true; L.order=shuffle(p.map(w=>w.id)); if(first&&L.order.length>1&&L.order[0]===first) L.order.push(L.order.shift()); L.orderKey=p.map(w=>w.id).sort().join('|'); L.pos=0; L.flipped=false; renderLearn(); if(!first) toast('Shuffled — every card once per round'); };
    const us=$('unshuf'); if(us) us.onclick=()=>{ const id=cur().id; L.shuf=false; L.idx=Math.max(0,p.findIndex(w=>w.id===id)); L.flipped=false; renderLearn(); };
    // swipe
    let sx=0; fl.ontouchstart=e=>sx=e.touches[0].clientX;
    fl.ontouchend=e=>{ const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>50) step(dx<0?1:-1); };
  }
  document.querySelectorAll('.item[data-say]').forEach(it=>it.onclick=()=>speak(it.dataset.say));
}
function ensureShufDeck(p){ // keep the shuffled deck in sync with the visible pool (day chip / search changes rebuild it)
  const key=p.map(w=>w.id).sort().join('|');
  if(!L.order||L.orderKey!==key){ L.order=shuffle(p.map(w=>w.id)); L.orderKey=key; L.pos=0; }
  if(L.pos>=L.order.length) L.pos=0;
}

// ---------------------------------------------------------------------
//  SENTENCE GENERATOR  (feeds Build → Tiles / Type it)
//  Nothing is stored: every "Next" builds a fresh pool of candidate
//  sentences from the tagged word bank, translates them, and picks the
//  one that fits your progress best (unseen, missed, due / weak / newest
//  words; no recent repeats).  Progress stays keyed by the word ids.
// ---------------------------------------------------------------------
const CAT_POS={Verbs:"v",Things:"n",Places:"n",People:"n",Describe:"adj",Time:"time"};
function G(w){ // grammar tag of a word: a guess from its category, overridden by w.g
  if(w._g) return w._g;
  const en=w.en.split('/')[0].replace(/\(.*?\)/g,'').trim().toLowerCase();
  const pos=CAT_POS[w.cat]||"x"; let g={pos,en};
  if(pos==='n'){ const cls=w.cat==='Places'?'place':w.cat==='People'?'person':'thing'; const a=(/^[aeiou]/.test(en)?'an ':'a ')+en; g={pos,cls:[cls],a,the:'the '+en,at:'at the '+en,to:'to the '+en}; }
  if(pos==='v') g={pos,en,obj:[],asp:'any'};
  if(pos==='adj') g={pos,en,of:[]};
  w._g={...g,...(w.g||{})}; if(!w._g.obj) w._g.obj=[]; if(!w._g.cls) w._g.cls=[]; if(!w._g.of) w._g.of=[]; return w._g;
}
const pk=a=>a.length?a[Math.floor(Math.random()*a.length)]:null;
const chance=p=>Math.random()<p;
const HARDB=()=>!!S.settings.buildHard;                     // Harder: stack more parts into each sentence
const hc=p=>chance(HARDB()?Math.min(.97,p*1.7+.2):p);      // boosted chance in harder mode
const has=id=>!!BY_ID[id];
const POS=p=>WORDS.filter(w=>G(w).pos===p);
const PRONS=()=>POS('pron');
const OTHERS=()=>PRONS().filter(p=>G(p).n!==1);           // you / he / we — subjects you can ask about
const TELLERS=()=>PRONS().filter(p=>G(p).s!=='you');       // I / he / we — subjects that make natural statements
const fpg=w=>!!w&&(G(w).n===1||G(w).s==='we');            // first-person group (I / we) — never 'we … with me'
const DYN=()=>POS('v').filter(v=>G(v).asp!=='simple');    // action verbs (eat, go, look…) vs states (like, have, know)
const DESTS=dir=>[...POS('loc').filter(l=>dir==='away'?!G(l).prox:dir==='toward'?G(l).prox:true),...POS('n').filter(n=>G(n).cls.includes('place'))];
// ---- English morphology & clause builder
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function enS3(v){ const [h,...r]=v.split(' '); let f; if(h==='have') f='has'; else if(h==='do') f='does'; else if(/(s|sh|ch|x|z|o)$/.test(h)) f=h+'es'; else if(/[^aeiou]y$/.test(h)) f=h.slice(0,-1)+'ies'; else f=h+'s'; return [f,...r].join(' '); }
function enIng(v){ const [h,...r]=v.split(' '); let f; if(/ie$/.test(h)) f=h.slice(0,-2)+'ying'; else if(/[^e]e$/.test(h)) f=h.slice(0,-1)+'ing'; else if(/^[^aeiou]*[aeiou][^aeiouwxy]$/.test(h)) f=h+h.slice(-1)+'ing'; else f=h+'ing'; return [f,...r].join(' '); }
function enPP(v){ const [h,...r]=v.split(' '); const IR={eat:'eaten',drink:'drunk',go:'gone',come:'come',see:'seen',know:'known',have:'had',take:'taken',get:'got',buy:'bought',say:'said',speak:'spoken',tell:'told',look:'looked',make:'made',do:'done',sleep:'slept',think:'thought',pay:'paid'}; let f=IR[h]; if(!f){ if(/[^aeiou]y$/.test(h)) f=h.slice(0,-1)+'ied'; else if(/e$/.test(h)) f=h+'d'; else if(/^[^aeiou]*[aeiou][^aeiouwxy]$/.test(h)) f=h+h.slice(-1)+'ed'; else f=h+'ed'; } return [f,...r].join(' '); }
function enPast(v){ const [h,...r]=v.split(' '); const IR={eat:'ate',drink:'drank',go:'went',come:'came',see:'saw',know:'knew',have:'had',take:'took',get:'got',buy:'bought',say:'said',speak:'spoke',tell:'told',make:'made',do:'did',think:'thought',sleep:'slept',pay:'paid'}; let f=IR[h]; if(!f){ if(/[^aeiou]y$/.test(h)) f=h.slice(0,-1)+'ied'; else if(/e$/.test(h)) f=h+'d'; else if(/^[^aeiou]*[aeiou][^aeiouwxy]$/.test(h)) f=h+h.slice(-1)+'ed'; else f=h+'ed'; } return [f,...r].join(' '); } // simple past for mʉ̂a-waan sentences
function enCmp(a){ const IR={good:'better',hot:'hotter',big:'bigger',far:'farther'}; if(IR[a]) return IR[a]; if(/[^aeiou]y$/.test(a)) return a.slice(0,-1)+'ier';
  if(a.length<=5&&!/ /.test(a)) return (/^[^aeiou]*[aeiou][^aeiouwxy]$/.test(a)?a+a.slice(-1):a)+(/e$/.test(a)?'r':'er'); return 'more '+a; } // cheap→cheaper, big→bigger, spicy→spicier, expensive→more expensive
const CONTR={I:"I'm",you:"you're",he:"he's",she:"she's",we:"we're",they:"they're",it:"it's"};
const contr=sb=>CONTR[sb.s]||`${sb.s} ${sb.be}`;
function subjOf(w){ // English subject descriptor {id,s,o,be,n} for a pronoun / noun / demonstrative
  const g=G(w);
  if(g.pos==='pron'){ const ss=g.s.split('|'), os=(g.o||g.s).split('|'), i=Math.floor(Math.random()*ss.length); return {id:w.id,s:ss[i],o:os[i]||os[0],be:g.be,n:g.n}; }
  if(g.pos==='dem') return {id:w.id,s:g.en,o:g.en,be:'is',n:3};
  return {id:w.id,s:g.the||g.en,o:g.the||g.en,be:'is',n:3};
}
const WHO=()=>({id:'khrai',s:'who',o:'who',be:'is',n:3});
// vp = {be:1,rest} | {modal:'can',head,rest} | {head,asp:'simple'|'prog',rest};  o = {mood:'stmt'|'yn'|'wh', wh, neg, tail, q}
function enClause(sb,vp,o={}){
  const S=sb.s, be=sb.be, n3=sb.n===3, mood=o.mood||'stmt', rest=vp.rest?' '+vp.rest:'', tail=o.tail?' '+o.tail:'';
  let t;
  if(vp.be){
    if(mood==='stmt') t=o.neg?(CONTR[S]?`${CONTR[S]} not${rest}`:`${S} ${be==='is'?"isn't":"aren't"}${rest}`):`${contr(sb)}${rest}`;
    else if(mood==='yn') t=`${be} ${S}${rest}`;
    else t=`${o.wh}${be==='is'&&!/ /.test(o.wh)?"'s":' '+be} ${S}${rest}`;
  } else if(vp.modal){
    const m=o.neg?"can't":'can';
    if(mood==='stmt') t=`${S} ${m} ${vp.head}${rest}`;
    else if(mood==='yn') t=`${m} ${S} ${vp.head}${rest}`;
    else t=`${o.wh} ${m} ${S} ${vp.head}${rest}`;
  } else if(vp.asp==='prog' && !(o.neg && (mood==='yn' || (mood==='wh' && be==='am')))){
    const ing=enIng(vp.head);
    if(mood==='stmt') t=`${contr(sb)} ${o.neg?'not ':''}${ing}${rest}`;
    else if(mood==='yn') t=`${be} ${S} ${ing}${rest}`;
    else t=`${o.wh} ${be}${o.neg?"n't":''} ${S} ${ing}${rest}`;
  } else {
    const d=n3?'does':'do';
    if(mood==='stmt') t=o.neg?`${S} ${d}n't ${vp.head}${rest}`:`${S} ${n3?enS3(vp.head):vp.head}${rest}`;
    else if(mood==='yn') t=`${d} ${S} ${vp.head}${rest}`;
    else t=`${o.wh} ${d}${o.neg?"n't":''} ${S} ${vp.head}${rest}`;
  }
  return cap(t+tail)+(mood==='stmt'&&!o.q?'.':'?');
}
// ---- Thai phrase builders
function objFor(v,sb){ // an object that verb v can take: {ids,en}
  const g=G(v), want=g.obj, opts=[];
  POS('n').forEach(n=>{ const gn=G(n); if(gn.cls.some(c=>want.includes(c))) opts.push({ids:[n.id],en:(g.art==='a'||gn.cls.some(c=>c==='food'||c==='drink'))?gn.a:gn.the,cls:gn.cls}); });
  if(want.includes('dem')) POS('dem').forEach(d=>opts.push({ids:[d.id],en:G(d).en}));
  if(want.includes('person')) PRONS().forEach(p=>{ if(p.id!==sb.id && !(fpg(p)&&fpg(BY_ID[sb.id]))) opts.push({ids:[p.id],en:subjOf(p).o}); });
  if(want.includes('loc')) POS('loc').forEach(l=>opts.push({ids:[l.id],en:'it '+G(l).en}));
  const o=pk(opts); if(!o) return null;
  if(o.cls && has('gap') && hc(.12)){ // "rice and water"
    const edb=x=>['food','drink'].includes(x.cls[0]); const b=pk(opts.filter(x=>x.cls && x.ids[0]!==o.ids[0] && x.cls[0]!==o.cls[0] && edb(x)===edb(o))); // pair like with like: rice+water, person+car — not rice+car
    if(b) return {ids:[o.ids[0],'gap',b.ids[0]],en:`${o.en} and ${b.en}`};
  }
  if(o.cls && o.ids.length===1 && hc(.14)){ // dress the noun: aahaan phèt = spicy food, rót nân = that car (adjective / nîi-nân AFTER the noun)
    if(chance(.55) && !G(BY_ID[o.ids[0]]).noPrice){ const a=pk(POS('adj').filter(x=>G(x).of.some(c=>o.cls.includes(c))));
      if(a){ let en=o.en.replace(/^((?:the|an?) )?/,(m,art)=>(art||'')+G(a).en+' ').replace(/^a ([aeiou])/,'an $1'); return {ids:[o.ids[0],a.id],en,cls:o.cls}; } }
    const d=pk(POS('dem').filter(x=>!G(x).an)); if(d) return {ids:[o.ids[0],d.id],en:`${G(d).en} ${o.en.replace(/^(?:the|an?) /,'')}`,cls:o.cls};
  }
  return o;
}
// Verb phrase (Thai ids after the subject + English pieces). opt: noAdj, noDest, wh:'arai'|'khrai'|'thiinai'|'gapkhrai'
function vpOf(v,sb,opt={}){
  const g=G(v), ids=[v.id], rest=[]; let head=g.en, obj=null;
  const asp=g.asp==='any'?(chance(.5)?'prog':'simple'):g.asp;
  if(opt.wh==='arai'||opt.wh==='khrai'){ if(!g.obj.length || (opt.wh==='arai'&&!g.obj.some(c=>c!=='person')) || (opt.wh==='khrai'&&!g.obj.includes('person'))) return null; ids.push(opt.wh); head=(opt.wh==='arai'&&g.whEn)||g.t||g.en; } // whEn: tam à-rai = what are you DOING (not making)
  else if(opt.noObj && g.needObj) return null;                                            // this verb can't appear bare
  else if(!opt.noObj && g.obj.length && !g.qobj && (g.needObj||hc(.8))){ obj=objFor(v,sb); if(!obj && g.needObj) return null; if(obj){ ids.push(...obj.ids); head=g.t||g.en; rest.push(obj.en); } }
  if(!obj && !ids.includes('arai') && !ids.includes('khrai') && g.it){ head=g.t||g.en; rest.push('it'); }
  if(g.dest){ if(opt.wh==='thiinai') ids.push('thiinai'); else if(!opt.noDest && (opt.needDest||hc(.6))){ const d=pk(DESTS(g.dest)); if(d){ ids.push(d.id); rest.push(G(d).to||G(d).en); } else if(opt.needDest) return null; } }
  else if(opt.wh==='thiinai'){ if(!g.at) return null; ids.push('thiinai'); }
  if(opt.wh==='gapkhrai'){ if(!g.with||!has('gap')) return null; ids.push('gap','khrai'); rest.push('with'); }
  if(!opt.wh && !opt.noAdj){
    // adjunct place skips holds-restricted spots (no eating "in the bathroom") — those still work as yùu/destinations
    const addPlace=()=>{ const p=pk(DESTS().filter(x=>!G(x).holds)); if(p){ if(G(p).pos==='loc'){ ids.push(p.id); rest.push(G(p).en); } else if(has('thii')){ ids.push('thii',p.id); rest.push(G(p).at); } } };

function toneMisses(id){ const t=S.tone[id]||{ok:0,bad:0}; return t.bad; }
function toneWeight(w){ return 1 + st(w.id).wrong*1.5 + toneMisses(w.id)*3 + (isWeak(w.id)?2:0); }
function tonePool(){ const all=WORDS.filter(w=>!w.tone.includes('+')); return T.filter==="missed"?all.filter(w=>isWeak(w.id)||toneMisses(w.id)>0):all; }
function pickTone(pool){ // weighted random, avoiding an immediate repeat
  const cand=pool.length>1?pool.filter(w=>w!==T.last):pool; const tot=cand.reduce((a,w)=>a+toneWeight(w),0); let r=Math.random()*tot;
  for(const w of cand){ r-=toneWeight(w); if(r<=0) return w; } return cand[cand.length-1];
}
function renderTones(){
  const pool=tonePool();
  if(!pool.length){ stage().innerHTML=`<div class="seg" id="tseg"><button data-f="all">All words</button><button data-f="missed" class="active">Missed</button></div><div class="empty">No missed words to drill.<br>Words you get wrong (or whose tone you mis-pick) collect here.</div>`;
    $('tseg').querySelectorAll('button').forEach(b=>b.onclick=()=>{ T.filter=b.dataset.f; T.cur=null; renderTones(); }); return; }
  if(!T.cur){ T.cur=pickTone(pool); T.phase="ask"; T.pick=null; }
  const w=T.cur; const done=T.phase!=="ask"; const voice=hasThaiVoice();
  const nMissed=WORDS.filter(w=>!w.tone.includes('+')&&(isWeak(w.id)||toneMisses(w.id)>0)).length;
  const html=`
    <div class="seg" id="tseg"><button data-f="all" class="${T.filter!=='missed'?'active':''}">All words</button><button data-f="missed" class="${T.filter==='missed'?'active':''}">Missed ${nMissed}</button></div>
    <div class="barlabel"><span>Which tone is it?</span><span>${T.right}/${T.n}</span></div>
    <div class="bar jade"><i style="width:${T.n?T.right/T.n*100:0}%"></i></div>
    <div class="card pop">
      ${plate(esc(w.th),done?romHtml(w):'',{say:voice?w.th:'',tone:done?w.tone:''})}
      <div class="sub">${esc(w.en)}${voice?' · tap the sign to hear it again':'<br>Look at the tone marks in the Thai script (and the reference below) — no Thai voice on this device.'}</div>
      <div class="tonegrid" id="tgrid">${TONES.map(t=>`<button class="tonebtn ${done&&t.key===w.tone?'ok':''} ${done&&T.pick===t.key&&t.key!==w.tone?'bad':''}" data-t="${t.key}" ${done?'disabled':''}>${toneGlyph(t.key)}<span>${t.label}<span class="mark">${t.mark}</span></span><small>${t.desc}</small></button>`).join('')}</div>
      ${done?`<div class="row act"><button class="btn gold" id="tnext">Next ${ic('arrow')}</button></div>`:''}
    </div>
    <details class="toneref"><summary>Tone reference & how the marks work</summary>
      <table>${TONES.map(t=>{ const ex=pool.filter(x=>x.tone===t.key).slice(0,2); return `<tr><td>${t.label} <span class="mark">${t.mark}</span>${toneGlyph(t.key)}</td><td>${t.desc}<br><span style="color:var(--muted)">${ex.map(x=>`<span class="thai" style="font-size:18px">${esc(x.th)}</span> ${esc(x.rom)}`).join(' · ')}</span></td></tr>`; }).join('')}</table>
      <p>In the romanisation, the little mark over the vowel <b>is</b> the tone: none = mid, <b>à</b> low, <b>â</b> falling, <b>á</b> high, <b>ǎ</b> rising. Thai has 5 tones and they change meaning: <span class="thai" style="font-size:16px">ไม่</span> mâi (falling) = not, but <span class="thai" style="font-size:16px">ไหม</span> mǎi (rising) = question marker! When you type answers, tones are optional — but try to say them out loud.</p>
    </details>`;
  stage().innerHTML=html;
  $('tseg').querySelectorAll('button').forEach(b=>b.onclick=()=>{ T.filter=b.dataset.f; T.cur=null; renderTones(); });
  if(voice&&!done&&S.settings.autoplay) setTimeout(()=>speak(w.th),150);
  if(!done) $('tgrid').onclick=e=>{ const b=e.target.closest('.tonebtn'); if(!b) return; T.pick=b.dataset.t; T.phase="done"; T.n++; const ok=T.pick===w.tone; if(ok) T.right++; const r=S.tone[w.id]||{ok:0,bad:0}; ok?r.ok++:r.bad++; S.tone[w.id]=r; logActivity(); save(); if(navigator.vibrate) navigator.vibrate(ok?15:[30,40,30]); renderTones(); };
  else $('tnext').onclick=()=>{ T.last=T.cur; T.cur=null; renderTones(); };
  renderStat();
}

// ---------------------------------------------------------------------
//  TEST  (readiness check for a day: every word of that day, typed in BOTH
//  directions, plus a few sentences from that day's words; no hints, no
//  show-answer, no audio, one shot, timed per answer; strict matching but
//  tones optional. Ends with a decisive verdict — ready / almost / not
//  ready — and flags the words that cost you the most time. "All days"
//  samples the whole bank instead, for an occasional overall measurement.)
// ---------------------------------------------------------------------
let X={stage:"setup",day:null,size:15,qs:[],i:0,t0:0,qt0:0,quit:false,result:null,tick:null};
const TEST_TYPES={en2th:"EN → Thai",th2en:"Thai → EN",build:"Sentence"};
const SLOW_MIN=3500;                                                   // an answer is "slow" only if it took longer than this AND well over your median
const fmtMs=ms=>{ const s=Math.round(ms/1000); return s>=60?`${Math.floor(s/60)}m ${String(s%60).padStart(2,'0')}s`:`${s}s`; };
const fmtSec=ms=>(ms/1000).toFixed(1)+'s';
const fmtDate=iso=>{ const d=new Date(iso); return d.toLocaleDateString(undefined,{day:'numeric',month:'short'}); };
const deltaHtml=(d,unit,goodUp)=>{ if(d==null) return ''; const up=d>0, cls=d===0?'flat':(up===goodUp?'up':'down'); return `<span class="delta ${cls}">${d===0?'=':(up?'▲':'▼')} ${unit==='%'?Math.abs(d)+'%':fmtMs(Math.abs(d))}</span>`; };
const testDay=()=>X.day==null?NEWEST_DAY():X.day;                     // null → newest day; 'all' → whole bank
const testLabel=r=>r.day==='all'?`All days · ${r.words} words`:`Day ${r.day}`;
function testWeight(w){ // "All days" sampling: weak, older and long-unseen words count more — nothing is excluded
  const a=stD(w.id,'th'), b=stD(w.id,'en'), wrong=a.wrong+b.wrong, last=Math.max(a.last,b.last);
  const stale=last?Math.min(30,(Date.now()-last)/864e5):12, age=NEWEST_DAY()-w.day;
  return 1 + wrong*1.2 + (isWeak(w.id)?2:0) + Math.min(4,age*.5) + stale*.15;
}
function wsample(pool,n,wf){ const out=[], c=pool.slice(); while(out.length<n&&c.length){ const ws=c.map(wf), tot=ws.reduce((a,x)=>a+x,0); let r=Math.random()*tot, k=c.length-1; for(let i=0;i<c.length;i++){ r-=ws[i]; if(r<=0){ k=i; break; } } out.push(c[k]); c.splice(k,1); } return out; }
function testSentences(day,n){ // fresh sentences, neutral settings; for a day, only sentences that use that day's words
  const built=[], keep={r:B.recent,f:B.recentFrames,fd:S.settings.focusDay,h:S.settings.buildHard,d:S.settings.buildDir};
  B.recent=[]; B.recentFrames=[]; S.settings.focusDay=day==='all'?0:day; S.settings.buildHard=false; S.settings.buildDir='th';
  try{ for(let k=0;k<n*6&&built.length<n;k++){ const s=genSentence(); if(!s) break; if(built.some(x=>x.key===s.key)) continue; if(day!=='all'&&!s.ids.some(id=>BY_ID[id].day===day)) continue; built.push(s); B.recent.unshift(s.key); B.recentFrames=[s.frame,...B.recentFrames].slice(0,4); } }
  finally{ B.recent=keep.r; B.recentFrames=keep.f; S.settings.focusDay=keep.fd; S.settings.buildHard=keep.h; S.settings.buildDir=keep.d; }
  return built;
}
function buildTest(day){
  const words=day==='all'?wsample(WORDS,Math.min(X.size,WORDS.length),testWeight):WORDS.filter(w=>w.day===day);
  if(!words.length) return [];
  const qs=[]; words.forEach(w=>{ qs.push({type:'en2th',id:w.id}); qs.push({type:'th2en',id:w.id}); });
  testSentences(day,Math.min(4,Math.max(2,Math.round(words.length/3)))).forEach(s=>qs.push({type:'build',sent:s}));
  shuffle(qs);
  for(let i=1;i<qs.length;i++) if(qs[i].id&&qs[i].id===qs[i-1].id){ const j=qs.findIndex((q,k)=>k>i&&q.id!==qs[i-1].id&&(k+1>=qs.length||qs[k+1].id!==qs[i].id)); if(j>0) [qs[i],qs[j]]=[qs[j],qs[i]]; } // no word twice in a row
  return qs.map(q=>({...q,typed:'',ok:null,ms:0}));
}
function startTest(){ const day=testDay(); X.qs=buildTest(day); if(!X.qs.length){ toast('No words in that day yet'); return; } X.runDay=day; X.i=0; X.t0=X.qt0=Date.now(); X.quit=false; X.result=null; X.stage='run'; renderTest(); }
function testSubmit(val){
  const q=X.qs[X.i]; if(!q) return; const w=q.id?BY_ID[q.id]:null; q.typed=val; q.ms=Date.now()-X.qt0;
  if(q.type==='en2th'){ q.ok=checkThaiStrict(w,val); record(w.id,q.ok,'th'); }
  else if(q.type==='th2en'){ q.ok=checkEnStrict(w,val); record(w.id,q.ok,'en'); }
  else { q.marks=matchSentence(q.sent.ids,val,true); q.ok=!q.marks.includes('bad'); const r=S.sent[q.sent.key]||{ok:0,bad:0}; q.ok?r.ok++:r.bad++; S.sent[q.sent.key]=r; logActivity(); save(); }
  if(navigator.vibrate) navigator.vibrate(10);
  X.i++; X.quit=false;
  if(X.i>=X.qs.length) finishTest(); else { X.qt0=Date.now(); renderTest(); }
}
function median(a){ if(!a.length) return 0; const s=a.slice().sort((x,y)=>x-y), m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; }
function finishTest(){
  const ms=Date.now()-X.t0, right=X.qs.filter(q=>q.ok).length;
  const wq=X.qs.filter(q=>q.id), med=median(wq.map(q=>q.ms)), thr=Math.max(SLOW_MIN,med*1.6);
  const slow=[...new Set(wq.filter(q=>q.ms>thr).map(q=>q.id))];                   // words that took you noticeably longer than your own median
  const rec={date:new Date().toISOString(),day:X.runDay,words:new Set(wq.map(q=>q.id)).size,n:X.qs.length,right,ms,med,thr,slow,
    qs:X.qs.map(q=>({type:q.type,id:q.id,ids:q.sent?q.sent.ids:undefined,en:q.sent?q.sent.en:undefined,typed:q.typed,ok:q.ok,ms:q.ms,marks:q.marks}))};
  rec.verdict=testVerdict(rec).level;
  S.tests=[...(S.tests||[]),rec].slice(-80); save();
  X.result=rec; X.stage='result'; renderTest();
}
// Decisive verdict. ready = you own the day: EVERY word right in both directions, at most ~1 in 5 words slow, and at least
// half the sentences. almost = ≥75% of word answers right and at most ~2 in 5 words shaky (wrong or slow). Otherwise not ready.
function testVerdict(r){
  const wq=r.qs.filter(q=>q.id), sq=r.qs.filter(q=>q.type==='build');
  const acc=wq.length?wq.filter(q=>q.ok).length/wq.length:0;
  const dir=d=>{ const x=wq.filter(q=>q.type===d); return {n:x.length,r:x.filter(q=>q.ok).length,acc:x.length?x.filter(q=>q.ok).length/x.length:1}; };
  const th=dir('en2th'), en=dir('th2en'), sAcc=sq.length?sq.filter(q=>q.ok).length/sq.length:1;
  const wrongIds=[...new Set(wq.filter(q=>!q.ok).map(q=>q.id))], slow=(r.slow||[]).filter(id=>!wrongIds.includes(id));
  const shaky=[...wrongIds,...slow], nW=r.words||new Set(wq.map(q=>q.id)).size||1;
  let level='not';
  if(!wrongIds.length && slow.length<=Math.max(1,Math.round(nW*.2)) && sAcc>=.5) level='ready';

const VERDICT={ready:{icon:'<i class="dot ok"></i>',title:'Ready',cls:'ok'},almost:{icon:'<i class="dot close"></i>',title:'Almost — not yet',cls:'close'},not:{icon:'<i class="dot bad"></i>',title:'Not ready',cls:'bad'}};
const testMissIds=r=>testVerdict(r).shaky.filter(id=>BY_ID[id]);
function prevTest(r){ const H=S.tests||[]; const i=H.indexOf(r); return H.slice(0,i<0?H.length:i).reverse().find(x=>x.day===r.day&&(r.day!=='all'||x.words===r.words))||null; }
function renderTest(){

  renderStat();
}
function renderTestSetup(){

  const ws=all?[]:WORDS.filter(w=>w.day===day), nQ=all?X.size*2+Math.min(4,Math.max(2,Math.round(X.size/3))):ws.length*2+Math.min(4,Math.max(2,Math.round(ws.length/3)));

function renderTestQ(){

//  first keystroke is the signal — under 3 s solid, 3–6 s shaky, over 6 s
//  forgotten. Lenient matching, as in Practice. Results by day

  const days=[...new Set(R.rows.map(x=>x.w.day))].sort((x,y)=>x-y), cats=CATS().filter(c=>R.rows.some(x=>x.w.cat===c));
  let html=`<div class="card pop"><div class="summary"><div class="big">${R.s.length} / ${n}</div>

      ${pv?`<br>vs ${fmtDate(pv.date)}: ${deltaHtml(R.pct-PR.pct,'%',true)} solid · <span class="delta ${dMed<0?'up':dMed>0?'down':'flat'}">${dMed===0?'=':(dMed>0?'▲ ':'▼ ')+fmtSec(Math.abs(dMed))}</span> median${slipped||back?`<br>${slipped} slipped since then · ${back} came back`:''}`:''}</p></div>

  const ad=$('adrill'); if(ad) ad.onclick=()=>drillStart(R.lost,rec.dir);
  $('adone').onclick=()=>{ A.result=null; A.view="setup"; renderAudit(); };
